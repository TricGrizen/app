/* 工艺法典：两黑一点金；沉墨/半明/金/蒙尘四态冻结；日间零动画（收墙一次过渡为唯一例外）；
   禁 blur/bloom/粒子/玻璃卡；金唯授精通、蒙尘=金降明度非新色；无可见滚动条；信息密度高。 */
:root{
  --paper:#000000;        /* 纯黑 · 墙之底（P16 件七 B：原 #04060b 系微蓝墨黑，纲领第一条即纯黑底，
                             Apple Books 夜读同底；--chrome 石黑不动，层差反而更清。
                             四档灰阶未动一个色值——底变暗只会抬高对比度，不会塌） */
  --chrome:#0a0d15;       /* 石黑 · 卡与带底 */
  --line:#171b24;
  --hair:#10131b;
  --s0:#3f4450;           /* 沉墨 · 未学（可辨不亮；章亥终验提亮一档 2c303a→3f4450——冷启动整墙皆此色，过暗则第一眼无从读墙） */
  --skel:#2a2e38;         /* 骨架未开放 · 更沉一档（随沉墨同步提亮 1b1f27→2a2e38，保持两态级差） */
  --s1:#8a8f98;           /* 半明 · 学过 */
  --gold:#d8bf8a;         /* 金 · 精通 */
  --gold2:#efd9a4;        /* 鎏金 · 强调峰 */
  --dun:#97906f;          /* 哑金 · 蒙尘（精通过期，金×降明度，远观不补光） */
  --txt:#c9ccd3; --dim:#5c6068; --faint:#373b44; --faint2:#262a33;
  --cjk:"Songti SC","Noto Serif CJK SC","STSong","SimSun",serif;
  --sans:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
  --fz:1;                 /* 字号旋钮基准（A−/A+ 步进，域 0.7~2.4） */
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);

  align-items:baseline;padding:1.05em 1.85em .62em;pointer-events:none;gap:1.23em;font-size:13px} /* B2：栏条钉 13px，内距/子字改 em，不随 --fz 越屏 */
#hud>*{pointer-events:auto}
/* A2 · standalone 刘海适配（mobilePatch 判 standalone→html.kysa）：栏顶让开安全区 */
html.kysa #hud{top:var(--sat)}
html.kysa body{padding-top:var(--sat)}
#brand{font-family:var(--cjk);font-size:1.17em;letter-spacing:.42em;color:var(--faint)}
#hudr{display:flex;gap:1.86em;align-items:baseline;font-family:var(--mono);font-size:.76em;
  letter-spacing:.16em;color:var(--faint)}
#hudr button:hover{color:var(--dim)}
#hudr a{color:inherit;text-decoration:none}
/* B1 · 浮动字号钮（三壳统一，抄 game.html #fzctl 族）：房内/各页均可调；z 在房(≈40)之上、⇅(9990)之下。
   位置上移+左让：避开底部读出条/关卡导航栏与右下 ⇅ 同步钮（bottom:12→48、right:14→50） */
#fzctl{position:fixed;right:50px;bottom:calc(48px + var(--sab));z-index:9988;display:flex;
  align-items:center;gap:.55rem;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--faint);
  opacity:.32;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums;transition:opacity .3s}
#fzctl:hover{opacity:.9}
#fzctl span{cursor:pointer;padding:2px 4px}
#fzctl span:hover{color:var(--dim)}
#cd{color:var(--dim)}
#cd:hover{color:var(--s1)}
#cd b{color:var(--gold);font-weight:400}

/* ————— 今日安排 ————— */
#plan{position:fixed;top:2.35rem;left:0;right:0;z-index:25;display:flex;gap:.55rem;align-items:center;
  padding:.15rem 1.5rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;
  flex-wrap:wrap;pointer-events:none}
#plan>*{pointer-events:auto}
#plan .pl{color:var(--faint2);letter-spacing:.24em;flex:none;white-space:nowrap} /* 窄屏 nowrap 横滑条里不许被挤成竖排 */
#plan .chip{border:1px solid var(--line);padding:.2rem .6rem;color:var(--dim);cursor:pointer;
  display:inline-flex;gap:.4rem;align-items:baseline;font-family:var(--cjk);letter-spacing:.02em}
#plan .chip:hover{border-color:#242a35;color:var(--s1)}
#plan .chip b{font-family:var(--mono);font-size:.58rem;font-weight:400;letter-spacing:.1em}
#plan .chip.due b{color:var(--dun)}
#plan .chip.new b{color:var(--gold)}
#plan .pgo{color:var(--faint);letter-spacing:.14em;font-variant-numeric:tabular-nums;flex:none;white-space:nowrap} /* AQ 工位五 · 进度读数 */

/* ————— 墙 ————— */
#wall{position:fixed;inset:0;padding:3.35rem 1.4rem 2.1rem;display:grid;
  grid-template-rows:auto 1.55fr 0.95fr 1.05fr;gap:.5rem} /* AQ 工位三：首行 auto = 墙顶常驻行（速查 chip + 图例） */
/* 墙顶行（P15 件二）：左「速查」chip（用户亲令位置=首页最顶上）＋右侧常驻图例，同占一行不多吃高度 */
#wtop{display:flex;align-items:center;gap:.2rem .9rem;flex-wrap:wrap}
.wchip{font-family:var(--cjk);font-size:.7rem;letter-spacing:.1em;color:var(--dim);flex:none;
  border:1px solid var(--line);padding:.16rem .72rem;border-radius:3px}
.wchip:hover{border-color:#242a35;color:var(--s1)}
/* 墙顶图例（AQ 工位三）：一行常驻、灰阶小号、零动画；微件取真实渲染件同色同尺寸
   （.row.hot1/.hot2 左线 2px、.row.due::after 左点 3px、.row .dots b 三态色），手机随 #wall 静态流照现 */
.lgd{display:flex;flex-wrap:wrap;align-items:center;gap:.12rem .85rem;font-family:var(--cjk);
  font-size:.58rem;letter-spacing:.05em;color:var(--faint);line-height:1.6;padding:0 0 .28rem;
  flex:1 1 auto;min-width:0}
.lgd i{display:inline-flex;align-items:center;gap:.3rem}
.lgd s{display:inline-flex;align-items:center;gap:3px;text-decoration:none} /* 微件与其标签抱成一团 */
.lgd u{display:inline-block;width:2px;height:.8rem;text-decoration:none;flex:none}
.lgd u.h1{background:rgba(216,191,138,.14)}
.lgd u.h2{background:rgba(216,191,138,.32)}
.lgd b{width:3px;height:3px;border-radius:50%;display:inline-block;background:var(--faint2);flex:none}
.lgd b.dd{background:#4e4939}
.lgd b.l1{background:#565b64}
.lgd b.l2{background:var(--gold)}
.lgd b.l3{background:var(--dun)}
.lgd em{color:var(--faint2);letter-spacing:0}
.band{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.bl{font-family:var(--cjk);font-size:.72rem;letter-spacing:.5em;color:var(--faint);flex:none;
  padding:0 0 .3rem;border-bottom:1px solid var(--hair);margin-bottom:.35rem;display:flex;align-items:baseline;gap:.6rem}
.bl em{font-family:var(--mono);font-size:.5rem;letter-spacing:.16em;color:var(--faint2);margin-left:auto}
.clusters{flex:1;min-height:0;display:flex;gap:1rem;overflow:hidden}
.cluster{flex:1 1 0;min-width:0;display:flex;flex-direction:column;overflow:hidden;
  border-left:1px solid var(--hair);padding-left:.7rem}
.cluster:first-child{border-left:none;padding-left:0}
.chd{font-family:var(--cjk);font-size:.65rem;letter-spacing:.06em;color:var(--faint);flex:none;
  padding-bottom:.26rem;margin-bottom:.24rem;position:relative;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;border-bottom:1px solid var(--hair)}
.chd .chi{font-family:var(--mono);font-size:.52rem;color:var(--faint2);margin-right:.4rem;letter-spacing:.05em}
.chd::after{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:calc(var(--glow,0)*100%);
  background:var(--gold);opacity:.5}
.cells{flex:1;min-height:0;display:flex;flex-direction:column;gap:.01rem;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;
  mask-image:linear-gradient(#000 93%,transparent);-webkit-mask-image:linear-gradient(#000 93%,transparent)}
.row{border-left:2px solid transparent;position:relative;display:flex;align-items:baseline;gap:.32rem;padding:.11rem .1rem .11rem .5rem;
  cursor:pointer;line-height:1.24;border-radius:2px}
.row .rt{font-family:var(--cjk);font-size:.71rem;font-weight:400;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1;min-width:0;transition:color .5s ease}
.row.s0 .rt{color:var(--s0)}
.row.skel .rt{color:var(--skel)}
.row.s1 .rt{color:var(--s1)}
.row.s2 .rt{color:var(--gold)}
.row.s2.due .rt{color:var(--dun)}
.row.open .rt{letter-spacing:.04em;color:var(--faint)}
.row.open.s1 .rt{color:var(--s1)}
.row.open.s2 .rt{color:var(--gold)}
.row.open::before{content:"";position:absolute;left:0;top:50%;width:2px;height:52%;
  transform:translateY(-50%);background:var(--faint2)}
.row.open.s2::before{background:var(--gold);opacity:.6}
.row .dots{flex:none;display:inline-flex;gap:2px;align-items:center}
.row .dots b{width:3px;height:3px;border-radius:50%;background:var(--faint2);display:inline-block}
.row.s1 .dots b{background:#565b64}
.row.s2 .dots b{background:var(--gold)}
.row.s2.due .dots b{background:var(--dun)}
.row.due::after{content:"";position:absolute;left:.14rem;top:50%;width:3px;height:3px;border-radius:50%;
  background:#4e4939;transform:translateY(-50%)}
.row.justlit .rt{color:var(--gold2)!important}
@media(hover:hover){.row:hover{background:rgba(255,255,255,.02)}.row:hover .rt{color:var(--txt)}}

/* ————— 读出条（悬停显完整 title/kind/covers）————— */
#read{position:fixed;left:0;right:0;bottom:0;z-index:26;padding:.5rem 1.5rem;
  font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;color:var(--faint);
  border-top:1px solid var(--hair);background:linear-gradient(transparent,rgba(0,0,0,.92) 40%);
  display:flex;gap:.9rem;align-items:baseline;min-height:1.85rem;pointer-events:none;white-space:nowrap;overflow:hidden}
#read b{color:var(--s1);font-weight:400;font-family:var(--cjk);letter-spacing:.02em}
#read .k{color:var(--gold);letter-spacing:.2em}
#read .cv{color:var(--dim)}

/* ————— 关卡页（房）————— */
#room{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;overscroll-behavior:contain}
#rin{max-width:62rem;margin:0 auto;min-height:100%;padding:3rem clamp(1.1rem,4vw,3rem) 6rem;
  display:flex;flex-direction:column}
#rtop{position:fixed;top:0;left:0;right:0;z-index:42;display:flex;align-items:baseline;gap:.9rem;
  padding:.85rem 1.5rem;background:linear-gradient(rgba(0,0,0,.97),rgba(0,0,0,.75) 70%,transparent);
  font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--faint);flex-wrap:wrap}
#rtop .rk{color:var(--gold);letter-spacing:.22em}
#rtop .rti{font-family:var(--cjk);font-size:.82rem;letter-spacing:.04em;color:var(--txt)}
#rtop .rx{margin-left:auto;cursor:pointer;color:var(--dim);font-size:.9rem;letter-spacing:0}
#rtop .rx:hover{color:var(--txt)}
/* P15 件三 · 顶条分层：.rtg=信息件组（关型/拍序/真题/字号），桌面 display:contents＝组不占位、
   儿孙直接站进顶条那一行，.rk{order:-1} 复原「关型在关名之前」的原次序，桌面逐像素不变；
   .rtmore=移动端 ⋯ 展开钮，.rtfz=移动端并进展开条的字号器——两者桌面恒隐（#fzctl 原位不动）。 */
#rtop .rtg{display:contents}
#rtop .rk{order:-1}
#rtop .rtmore,#rtop .rtfz{display:none}
#beats{display:flex;gap:.42rem;align-items:baseline}
#beats span{color:var(--faint2);letter-spacing:.08em}
#beats span.on{color:var(--gold)}
#beats span.done{color:var(--dim)}
#beats i{color:var(--faint2)}
/* 目录行（P16 件三）：只在收墙关（回看态）出现——拍 chip ＋ 讲解节 chip 直达随机访问；
   学习中的关不渲（守收墙四闸）。桌面随顶条同行折行，移动展开态独占第三行横滚。 */
#rtop .rtoc{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
  align-items:center;gap:.3rem;min-width:0}   /* 一行横滚：chip 再多也不把顶条撑成一堵墙 */
.tchip{flex:none;font-family:var(--cjk);font-size:.62rem;letter-spacing:.04em;color:var(--faint);
  border:1px solid var(--hair);padding:.08rem .42rem;border-radius:3px;white-space:nowrap;line-height:1.5}
.tchip:hover{color:var(--s1);border-color:#242a35}
.tchip.on{color:var(--gold);border-color:#3a3524}
.tchip.ts{color:var(--faint2)}
.tchip.ts:hover{color:var(--dim)}

/* 关卡内容排印（P14 可读性微调：只动间距节奏，色值/字号一律未改——节与节拉开、
   段与段留白、列表与引用块各得一口气；讲解拍一屏内的层级由此自明） */
.sec{margin:1.6rem 0}
.sec:first-child{margin-top:.8rem}
.sech{font-family:var(--cjk);font-size:1.02rem;font-weight:400;color:var(--txt);letter-spacing:.02em;
  margin:0 0 .62rem;line-height:1.45}
.rbody{font-family:var(--cjk);font-size:.92rem;line-height:1.9;color:var(--s1)}
.rbody p{margin:.62rem 0}
.rbody p:first-child{margin-top:0}
.rbody p:last-child{margin-bottom:0}
.rbody strong{color:var(--gold2);font-weight:400}
.rbody code{font-family:var(--mono);font-size:.85em;color:var(--txt);background:var(--chrome);
  border:1px solid var(--line);border-radius:3px;padding:.03rem .3rem;letter-spacing:0}
.rbody del{color:#7a5c5c;text-decoration-color:#5a3838}
.rbody ul,.rbody ol{margin:.7rem 0 .7rem .2rem;padding-left:1.15rem}
.rbody li{margin:.34rem 0}
.rbody ol.steps{list-style:none;padding-left:0;counter-reset:st}
.rbody ol.steps>li{counter-increment:st;position:relative;padding-left:1.7rem;margin:.62rem 0}
.rbody ol.steps>li::before{content:counter(st);position:absolute;left:0;top:.05rem;
  font-family:var(--mono);font-size:.64rem;color:var(--faint);border:1px solid var(--line);
  width:1.15rem;height:1.15rem;display:flex;align-items:center;justify-content:center;border-radius:2px}
.rbody blockquote{margin:.8rem 0;padding:.55rem 1.05rem;border-left:2px solid var(--line);
  background:rgba(255,255,255,.012);color:var(--txt);font-size:.9rem;line-height:1.88}
.rbody .katex{color:inherit}
.rbody .katex-display{margin:.65rem 0;overflow-x:auto;overflow-y:hidden}
.katex-error{color:#b5545a!important;font-family:var(--mono)!important;font-size:.82em!important}
.kx-raw{font-family:var(--mono);color:#9aa2ad;font-size:.85em}

/* ————— 图讲块（P14 · detail[].fig）—————
   图在上、当步说在下、步进点一排。无边框无阴影无渐变，SVG 背景透明直接落在纯黑上；
   色只取既有五阶（--s0/--s1/--txt/--dim/--gold），金唯归当步强调（hl）；切步瞬时换装，零 transition。
   线宽走 vector-effect 钉成 px（不随图放缩变粗细）；字号/点径由 figMount 按实测缩放钉成 px。 */
.fig{margin:1rem 0 1.15rem}
.figc{cursor:pointer;padding:.1rem 0}
.figsvg{display:block;width:100%;height:auto;max-height:38vh;overflow:hidden}
.figsvg .fs{fill:none;stroke:var(--fc,var(--s1));stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.figsvg .fs.ax{stroke-width:1}
.figsvg .fs.hl{stroke-width:1.5}
.figsvg .ff{fill:var(--fc,var(--s1));stroke:none}
.figsvg text{font-family:var(--sans);letter-spacing:.02em}
.figsay{font-family:var(--cjk);font-size:.92rem;line-height:1.88;color:var(--s1);
  min-height:3.4em;padding:.35rem .05rem 0}      /* 最小高锁死：步间文字长短不一也不跳图 */
.figsay p{margin:.2rem 0}
.figbar{display:flex;align-items:center;gap:.6rem;margin-top:.5rem;flex-wrap:wrap;row-gap:.35rem}
/* P16 件五：大字号（fz2.4）下「‹ 上一步｜点排｜下一步 ›」三件挤不下一行——换行而非溢出，
   两端按钮永远够得着（fz1/1.4 装得下，一行照旧、桌面零变化）。 */
.figdots{flex:1;display:flex;justify-content:center;align-items:center;gap:.05rem}
.fdot{padding:.4rem .32rem;line-height:0}
.fdot i{display:block;width:4px;height:4px;border-radius:50%;background:var(--faint)}
.fdot.past i{background:#565b64}   /* 与墙上「学过」点同色，读起来是同一套语言 */
.fdot.on i{background:var(--gold)}
.fnav{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--dim);
  padding:.35rem .15rem;white-space:nowrap;flex:none}
.fnav:hover{color:var(--txt)}
.fnav[disabled]{color:var(--faint2);cursor:default}

/* ————— 推导层（P15 · detail[].deriv）—————
   折叠头行默认收起（▸ 推导 · 块题 · N 页），tap 展开为轮播卡、再 tap 头行收回。
   卡＝卡题＋正文（微标记全集）＋右上「预支」小签；底部步进点与图讲共用 .figbar/.fdot/.fnav 一套语言。
   卡高随内容自适应（不锁高不内滚）；切卡瞬时换 innerHTML，零 transition/animation。 */
.drv{margin:.95rem 0 1.1rem}
.drvh{display:block;width:100%;font-family:var(--cjk);font-size:.8rem;letter-spacing:.04em;
  color:var(--dim);line-height:1.55;padding:.4rem 0}
.drvh:hover{color:var(--txt)}
.drvh i{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;color:var(--faint)}
.drvbox{border:1px solid var(--hair);border-radius:4px;padding:.1rem .95rem .5rem;margin-top:.1rem}
.drvc{cursor:pointer;padding:.55rem 0 .15rem}
.drvkr{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.drvk{font-family:var(--cjk);font-size:.95rem;color:var(--txt);line-height:1.6;flex:1 1 60%;min-width:0}
.drvtag{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;color:var(--faint);flex:none}
.drvt{margin-top:.42rem}

/* ————— 批注层（P21B · detail[].notes）—————
   夹批＝句级旁白：正文 anchor 首现处挂一枚极小灰标（上标「注」，#333 级→hover/开态半明），
   点标即在该段之后就地展开灰字批注块（左 2px 竖线＋缩进＋首行极小「批注」），再点标或块任意处即收。
   零动画、无箭头（details 先例）、灰阶分级：块内文字比正文暗一档、比 --dim 亮一档，读得出「这是旁白不是正文」。
   小标 line-height:0 ＋ vertical-align:super ⇒ 不撑行高、不打断行的节奏。 */
.nmk{font-family:var(--sans);font-size:.55em;line-height:0;vertical-align:super;color:var(--dim);
  padding:0 .06em 0 .16em;letter-spacing:.02em;white-space:nowrap}
.nmk:hover,.nmk.on{color:var(--s1)}
.note{display:none;margin:.62rem 0 .78rem;padding:.06rem 0 .06rem .9rem;
  border-left:2px solid var(--faint);cursor:pointer}   /* --faint#373b44＝本壳蓝墨灰阶里的「#333 级」 */
.note.on{display:block}
.note .nlb{font-family:var(--mono);font-size:.56rem;letter-spacing:.2em;color:var(--faint);margin-bottom:.3rem}
.note .ntt{font-size:.86rem;line-height:1.85;color:#767b84}      /* 次级灰：暗于正文 --s1、亮于 --dim */
.note .ntt strong{color:#767b84}   /* 批注禁金字（verify 硬闸）；万一漏网也不许在旁白里冒金 */

/* 对比表 */
.ctab{margin:.7rem 0;overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:4px}
.ctab table{border-collapse:collapse;width:100%;font-size:.82rem}
.ctab th,.ctab td{border:1px solid var(--line);padding:.42rem .6rem;text-align:left;
  vertical-align:top;color:var(--s1);line-height:1.55}
.ctab th{color:var(--dim);font-weight:400;background:var(--chrome);font-family:var(--mono);
  font-size:.68rem;letter-spacing:.06em;white-space:nowrap}

/* 病笔（避雷） */
.plabel{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;color:var(--faint);margin-bottom:.5rem}
.plabel.gold{color:var(--gold)}
.pit{margin:.55rem 0;padding:.55rem .9rem;border:1px solid #2a2020;border-radius:4px;background:rgba(40,26,26,.16)}
.pit .pw{color:#8a6b6b;font-size:.86rem;line-height:1.6}
.pit .pw del{color:#8a6b6b}
.pit .py{color:var(--s1);font-size:.84rem;line-height:1.7;margin-top:.35rem}
.pit .py::before{content:"为何错 · ";color:var(--faint);font-family:var(--mono);font-size:.62rem;letter-spacing:.12em}

/* 承诺/押注 */
.commit{margin:.95rem 0}
.commit .clab{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;color:var(--faint);margin-bottom:.5rem}
.opt{display:block;width:100%;margin:.32rem 0;padding:.58rem .9rem;border:1px solid var(--line);
  border-radius:4px;color:var(--s1);font-family:var(--cjk);font-size:.9rem;line-height:1.5;
  transition:border-color .2s,color .2s}
.opt:hover{border-color:#2b313d;color:var(--txt)}
.opt.right{border-color:var(--gold);background:rgba(216,191,138,.06)}
.opt.right::after{content:"✓";color:var(--gold);float:right}
.opt.wrong{border-color:#3a2626;color:var(--dim)}
.opt.wrong::after{content:"✕";color:#7a5c5c;float:right}
.opt[disabled]{cursor:default}
.why{margin:.6rem 0;padding:.55rem .9rem;border-left:2px solid var(--gold);
  background:rgba(216,191,138,.045);color:var(--s1);font-size:.88rem;line-height:1.78;font-family:var(--cjk)}
.why::before{content:"揭示 · ";color:var(--gold);font-family:var(--mono);font-size:.62rem;letter-spacing:.14em}

/* 跟算步骤 */
.step{position:relative;margin:.5rem 0;padding:.6rem .9rem .6rem 2.1rem;border:1px solid var(--hair);border-radius:4px}
.step .sn{position:absolute;left:.55rem;top:.62rem;font-family:var(--mono);font-size:.64rem;
  color:var(--faint);border:1px solid var(--line);width:1.25rem;height:1.25rem;display:flex;
  align-items:center;justify-content:center;border-radius:2px}
.step.on .sn{color:var(--gold);border-color:#3a3524}
.step.done{opacity:.66}
.step.done .sn{color:var(--dim)}
.step .sdo{font-family:var(--cjk);font-size:.92rem;color:var(--txt);line-height:1.68}
.step .swhy{font-size:.82rem;color:var(--dim);line-height:1.68;margin-top:.3rem;font-family:var(--cjk)}
.step .swhy::before{content:"为何这一步 · ";color:var(--faint);font-family:var(--mono);font-size:.6rem;letter-spacing:.1em}
.step .skx{margin:.45rem 0 .1rem;text-align:left;overflow-x:auto;overflow-y:hidden}
.step .locked{color:var(--faint);font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;cursor:pointer}
.step .locked:hover{color:var(--dim)}

/* 触发器 */
.trig{margin:.7rem 0;padding:.6rem .95rem;border:1px solid var(--line);border-radius:4px;background:var(--chrome)}
.trig .tl{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;color:var(--gold);margin-bottom:.35rem}
.trig .tt{font-family:var(--cjk);font-size:.9rem;color:var(--s1);line-height:1.85}

/* 底部导航（桌面=固定条 #rnav；移动纯读=内容流末尾 #rnavin，读完即见——P15 件三） */
#rnav{position:fixed;left:0;right:0;bottom:0;z-index:42;display:flex;gap:1rem;align-items:center;
  justify-content:center;padding:1rem 1.5rem 1.3rem;background:linear-gradient(transparent,var(--paper) 45%)}
#rnav:empty{display:none}
#rnavin{display:none;gap:1rem;align-items:center;justify-content:center;flex-wrap:wrap;row-gap:.55rem;
  margin-top:2.1rem;padding-top:1.05rem;border-top:1px solid var(--hair)}
.nbtn{border:1px solid var(--line);padding:.55rem 1.5rem;border-radius:4px;font-family:var(--mono);
  font-size:.68rem;letter-spacing:.16em;color:var(--dim)}
.nbtn:hover{border-color:#2b313d;color:var(--txt)}
.nbtn.seal{border-color:#3a3524;color:var(--gold)}
.nbtn.seal:hover{background:rgba(216,191,138,.07)}
.nbtn[disabled]{opacity:.4;cursor:default;color:var(--faint)}

/* 骨架关（未开放）信息页 */
.skelp .stag{font-family:var(--mono);font-size:.64rem;letter-spacing:.18em;color:var(--faint);
  border:1px solid var(--line);display:inline-block;padding:.25rem .7rem;border-radius:3px;margin-bottom:1.1rem}
.atom{margin:.9rem 0;padding:.7rem .95rem;border-left:2px solid var(--line);background:rgba(255,255,255,.01)}
.atom .an{font-family:var(--cjk);font-size:.92rem;color:var(--txt);margin-bottom:.35rem;letter-spacing:.02em}
.atom .an i{font-family:var(--mono);font-size:.6rem;color:var(--faint);margin-right:.5rem;letter-spacing:.06em}
.atom .ac{font-family:var(--cjk);font-size:.86rem;color:var(--s1);line-height:1.75;margin:.2rem 0}
.atom .req{font-size:.82rem;color:var(--dim);line-height:1.7;margin-top:.3rem}
.atom .req b{color:var(--gold);font-weight:400;font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;margin-right:.4rem}
.track{margin:1.2rem 0;padding:.75rem .95rem;border:1px solid var(--line);border-radius:4px;background:var(--chrome)}
.track .tkl{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;color:var(--gold);margin-bottom:.5rem}
.track .tk{font-family:var(--cjk);font-size:.84rem;color:var(--s1);line-height:1.72;margin:.28rem 0}
.track .tk i{color:var(--faint);font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;margin-right:.5rem}
.laying{margin:1.2rem 0;color:var(--faint);font-family:var(--cjk);font-size:.86rem;letter-spacing:.05em;text-align:center}

/* 概览四件套（开章关） */
.ov{margin:1rem 0}
.ov .ovl{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;color:var(--gold);margin-bottom:.42rem}
.ovmap{list-style:none;padding:0;margin:.5rem 0}
.ovmap li{font-family:var(--cjk);font-size:.9rem;color:var(--s1);line-height:1.72;margin:.4rem 0;
  padding-left:.9rem;border-left:1px solid var(--line)}

/* 复习页 */
.rev{margin:1.1rem 0}
.revq{font-family:var(--cjk);font-size:1rem;color:var(--txt);line-height:1.88;margin:.8rem 0}
.judge{display:flex;gap:1rem;margin:1.1rem 0}
.jb{flex:1;border:1px solid var(--line);padding:.7rem;text-align:center;border-radius:4px;
  font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;color:var(--dim)}
.jb.ok:hover{border-color:#3a3524;color:var(--gold)}
.jb.no:hover{border-color:#3a2626;color:#a97}

/* 速查 / 错题档 页 */
#page{position:fixed;inset:0;z-index:38;background:var(--paper);overflow-y:auto;overscroll-behavior:contain}
#pin{max-width:62rem;margin:0 auto;padding:3rem clamp(1.1rem,4vw,3rem) 4rem}
.ph{font-family:var(--cjk);font-size:1.05rem;letter-spacing:.12em;color:var(--txt);margin-bottom:.3rem}
.psub{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;color:var(--faint);margin-bottom:1.4rem}
.qgrp{margin:1.2rem 0}
.qgn{font-family:var(--cjk);font-size:.82rem;letter-spacing:.1em;color:var(--dim);
  border-bottom:1px solid var(--hair);padding-bottom:.3rem;margin-bottom:.5rem}
.qrow{display:flex;gap:.7rem;align-items:baseline;padding:.28rem 0;font-size:.86rem;line-height:1.6}
.qrow .qt{font-family:var(--cjk);color:var(--s1);flex:none;width:9rem;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.qrow .qt:hover{color:var(--txt)}
.qrow .qtr{color:var(--dim);font-size:.82rem;line-height:1.65;flex:1;min-width:0}
.qrow.locked .qt{color:var(--s0)}
.qrow.locked .qtr{color:var(--faint)}
.empty{color:var(--faint);font-family:var(--cjk);font-size:.9rem;text-align:center;margin:3rem 0;letter-spacing:.05em;line-height:2}
/* ————— 速查册（P15 件二 · formulas.json）—————
   页首目录（章→节两级，节为可换行 chip 行，点击瞬跳锚点、零平滑动画）；正文=节题＋条目一条一行。
   长公式在条目容器内横滚（滚动条全局已隐），不撑破版心。 */
.sqtoc{margin:.1rem 0 1.5rem;border-bottom:1px solid var(--hair);padding-bottom:.75rem}
.sqtc{display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem .5rem;margin:.32rem 0}
.sqtn{font-family:var(--cjk);font-size:.74rem;letter-spacing:.08em;color:var(--dim);flex:none}
.sqt{font-family:var(--cjk);font-size:.7rem;letter-spacing:.02em;color:var(--faint);
  border:1px solid var(--line);padding:.1rem .5rem;border-radius:3px;cursor:pointer}
.sqt:hover{color:var(--s1);border-color:#242a35}
.sqg{margin:1.25rem 0}
.sqgh{font-family:var(--cjk);font-size:.84rem;letter-spacing:.08em;color:var(--dim);
  border-bottom:1px solid var(--hair);padding-bottom:.3rem;margin-bottom:.45rem;
  overflow-x:auto;overflow-y:hidden}   /* 节题也可带 $…$，大字号下长题在自己容器里横滚，不撑破版心 */
.sqgh i{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;color:var(--faint2);margin-right:.5rem}
.sqi{font-family:var(--cjk);font-size:.88rem;line-height:1.95;color:var(--s1);
  padding:.1rem 0;overflow-x:auto;overflow-y:hidden}
.pback{position:fixed;top:.85rem;right:1.5rem;z-index:39;font-family:var(--mono);font-size:.66rem;
  letter-spacing:.14em;color:var(--dim);cursor:pointer}
.pback:hover{color:var(--txt)}

/* ————— 知识图谱（P20 · tools/math/buildmap.json v2）—————
   大地图＝一张高数全景图谱：**手排坐标直读**（fable 亲笔 pos，canvas 内 y 越大越靠下＝地基在底），
   按容器等比缩放；单位尺度有下限＝「任两盒不相压」的临界值（渲染期以真实字宽算出，bmUnitMin），
   压不下去就横滚／纵滚（SPEC 授权的容器内滚，滚动条全局已隐）。P19 的章级 DAG 拓扑分层已废。
   节点＝圆角小盒（类型微签＋件名）：已开讲按其 at 关**最高进度**染色（投影律：渲染期派生永不落盘），
   未开讲（at 空）再暗一档＝预告态；spine（「边界读内部」金线）四件微金描边常亮。
   边按 rel 分线型——奠基·推出实线 r1／工具虚线 r2／统一加粗 r3／对偶点划 r4／推广实线＋末端小箭头 r5；
   两端皆在 spine 上的边＝微金常亮（ftc→green→gauss／stokes）。
   选中＝该件与一阶邻居正常、连边转金，其余压暗；再点空白复原。零动画（原地换 innerHTML）。
   小地图＝关内一阶子图（上游左／本关中／下游右），复用同一套节点与边绘制器，更小号。
   SVG viewBox 宽＝实测容器像素宽 ⇒ 缩放恒 1，px 即 px；字号随 --fz 旋钮成比例（bmScale）。 */
/* 版心：图谱是宽件，册子页 62rem 太窄（侧栏一占，图只剩 638px）；放宽到 82rem，
   侧栏与栏距按 min(Xrem,Ypx) 封顶——大字号下侧栏不再吃掉整张图（P16 chrome 封顶手法）。*/
body.mapw #pin{max-width:82rem;padding-bottom:1.4rem}   /* 图页底衬收薄：4rem 的空白正好把「一屏」顶出去 */
.mapv{display:grid;grid-template-columns:minmax(0,1fr) min(14rem,246px);gap:min(1rem,18px);align-items:start}
/* 图容器：装得下就整图居中零横滚；装不下（窄屏／大字号）就在自己容器里横滑
   ——SPEC 授权的「移动端容器内滚」，滚动条全局已隐，文档级 overflow-x 照旧钉死不晃。 */
.mapbox{min-width:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
/* 真能横滚时才挂右缘渐隐＝可滑暗示（同墙 .cells／#mchips 手法；装得下时不挂，最右一列不被吃） */
.mapbox.xscr,.bmsub.xscr{mask-image:linear-gradient(90deg,#000 96%,transparent);
  -webkit-mask-image:linear-gradient(90deg,#000 96%,transparent)}
.bmsvg{display:block;max-width:none}
.bmsvg .bmn{cursor:pointer}
/* 节点盒填 --paper 实色（**不是半透明**）：先画边后画节点，实色才遮得住从盒上穿过的连线；
   底本就是纯黑，实色与半透明视觉等价却不压字（首版半透明 .013 被实拍抓到线穿件名）。 */
.bmsvg .bmr{fill:var(--paper)}
.bmsvg .bmt{font-family:var(--cjk)}
.bmsvg .bmk{font-family:var(--mono);fill:var(--faint)}
.bmsvg .bmch{font-family:var(--cjk);fill:var(--dim)}        /* 小地图列标：三栏语义的唯一标识，须读得出 */
.bmsvg .bme{fill:none;stroke-width:1}
.bmsvg .bmhit{fill:none;stroke:transparent;stroke-width:11;cursor:pointer}
.bmsvg .dim{opacity:.24}                                     /* 压暗但不抹掉：图谱的价值在「看清它在整体里的位置」 */
@media(hover:hover){.bmsvg .bmn:hover .bmr{fill:#0a0a0a}}
/* 五档染色与五种线型一律走 CSS class，**不写进 SVG presentation attribute**——
   属性里的 var() 至今是规范未定区（各引擎不一致），math 已上 iOS 主屏 PWA，
   一旦不解析就回落 fill=black＝纯黑底上整图无字。CSS 声明里的 var() 才是标准行为。 */
.bmsvg .bmr.p0{stroke:var(--skel)}   .bmsvg .bmt.p0{fill:var(--s0)}
.bmsvg .bmr.p1{stroke:var(--s0)}     .bmsvg .bmt.p1{fill:var(--s1)}
.bmsvg .bmr.p2{stroke:#4c4331}       .bmsvg .bmt.p2{fill:var(--gold)}
.bmsvg .bmr.p3{stroke:#3e3b2d}       .bmsvg .bmt.p3{fill:var(--dun)}
.bmsvg .bmr.pu{stroke:#191d26}       .bmsvg .bmt.pu{fill:#2f333c}   /* 未开讲＝比沉墨再暗一档（预告态） */
.bmsvg .bmk.pu{fill:#21252d}
.bmsvg .r1 .bme{stroke:#454b57}
.bmsvg .r2 .bme{stroke:#343a45;stroke-dasharray:5 4}
.bmsvg .r3 .bme{stroke:#4e5561;stroke-width:1.9}
.bmsvg .r4 .bme{stroke:#3b414d;stroke-dasharray:6 2.6 1.6 2.6}
.bmsvg .r5 .bme{stroke:#454b57}      .bmsvg .r5 polygon{fill:#454b57}
/* 金线（spine 两端相连的边）＝微金常亮：整张图唯一的「一点金」主脉，压暗态照旧让位 */
.bmsvg .spn .bme{stroke:#7b6b43}     .bmsvg .spn polygon{fill:#7b6b43}
.bmsvg .bmn.sp .bmr{stroke:#4a4030}                          /* 金线件：微金描边常亮，文字仍按进度染 */
.bmsvg .bmeg.on .bme{stroke:var(--gold);stroke-width:1.4;opacity:.7}
.bmsvg .bmeg.on polygon{fill:var(--gold);opacity:.7}
.bmsvg .bmn.sel .bmr{fill:#0c0b08;stroke:var(--gold)}        /* #0c0b08＝rgba(216,191,138,.055) 叠纯黑的等效实色 */
.bmsvg .bmn.sel .bmt{fill:var(--txt)}                        /* 焦点件的名字必须最亮（金留给精通与连边，不撞语义） */
/* 详情面板（桌面＝右侧栏 sticky；移动＝内容流末尾 sticky 贴底，见下方纯读块） */
.mappan{border:1px solid var(--hair);border-radius:4px;padding:.6rem .8rem;position:sticky;top:.6rem;
  background:var(--paper);min-height:11rem}   /* 高度给足：桌面鼠标扫图时右栏换装不来回伸缩 */
.mappan .bmpk{font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;color:var(--faint)}
.mappan .bmpt{font-family:var(--cjk);font-size:.9rem;color:var(--txt);line-height:1.5;margin:.28rem 0 .35rem}
.mappan .bmpw{font-family:var(--cjk);font-size:.8rem;color:var(--s1);line-height:1.78}
.mappan .bmpl{font-family:var(--cjk);font-size:.68rem;letter-spacing:.04em;color:var(--dim);margin-top:.5rem}
.mappan .bmpn{font-family:var(--cjk);font-size:.72rem;color:var(--dim);line-height:1.7;margin-top:.42rem;
  border-top:1px solid var(--hair);padding-top:.4rem}
.mappan .bmpn>i{color:var(--faint);font-family:var(--mono);font-size:.56rem;letter-spacing:.1em;margin-right:.3rem}
.mappan .bmpn i{color:var(--faint);font-family:var(--mono);font-size:.54rem;letter-spacing:.1em;margin:0 .1rem 0 .22rem}
.mappan .bmpgo{display:inline-block;margin-top:.55rem;font-family:var(--mono);font-size:.62rem;
  letter-spacing:.12em;color:var(--dim);border:1px solid var(--line);padding:.24rem .7rem;border-radius:3px}
.mappan .bmpgo:hover{color:var(--gold);border-color:#3a3524}
.mappan .bmpe{color:var(--faint);font-family:var(--cjk);font-size:.78rem;line-height:1.75}
.maplg{font-family:var(--cjk);font-size:.58rem;letter-spacing:.04em;color:var(--faint);line-height:1.9;
  margin-top:.75rem;display:flex;flex-wrap:wrap;gap:.1rem .8rem}
.maplg s{display:inline-flex;align-items:center;gap:.28rem;text-decoration:none}
.maplg u{display:inline-block;width:22px;height:0;border-top-width:1px;text-decoration:none;flex:none}
.maplg u.r1{border-top-style:solid;border-top-color:#454b57}
.maplg u.r2{border-top-style:dashed;border-top-color:#343a45}
.maplg u.r3{border-top-style:solid;border-top-color:#4e5561;border-top-width:2px}
.maplg u.r4{border-top-style:dotted;border-top-color:#3b414d}
.maplg u.r5{border-top-style:solid;border-top-color:#454b57}
.maplg u.sp{border-top-style:solid;border-top-color:#7b6b43}
.maplx{font-family:var(--cjk);font-size:.56rem;letter-spacing:.04em;color:var(--faint2);line-height:1.8;margin-top:.35rem}

/* 小地图（关内脉络块）：首拍尾部；图上、三行自动文案在下、tap 件即在块内显 why */
.bmblk{margin:1.7rem 0 .3rem;padding-top:1rem;border-top:1px solid var(--hair)}
.bmblk .bmh{font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;color:var(--faint);margin-bottom:.55rem;
  display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap}
.bmblk .bmfull{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;color:var(--dim);margin-left:auto}
.bmblk .bmfull:hover{color:var(--gold)}
.bmsub{min-width:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.bmsay{margin-top:.55rem;font-family:var(--cjk);font-size:.8rem;line-height:1.85;color:var(--s1)}
.bmsay div{margin:.12rem 0}
.bmsay i{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;color:var(--faint);margin-right:.45rem}
.bmsay em{color:var(--dim)}
.bmspan{margin-top:.55rem;border-left:2px solid var(--line);padding:.35rem .8rem;min-height:2.6rem}
.bmspan .bmpk{font-family:var(--mono);font-size:.56rem;letter-spacing:.16em;color:var(--faint)}
.bmspan .bmpt{font-family:var(--cjk);font-size:.86rem;color:var(--txt);line-height:1.55;margin:.2rem 0 .25rem}
.bmspan .bmpw{font-family:var(--cjk);font-size:.8rem;color:var(--s1);line-height:1.8}
.bmspan .bmpgo{display:inline-block;margin-top:.4rem;font-family:var(--mono);font-size:.6rem;
  letter-spacing:.12em;color:var(--dim);border:1px solid var(--line);padding:.2rem .6rem;border-radius:3px}
.bmspan .bmpgo:hover{color:var(--gold);border-color:#3a3524}
.bmspan .bmpe{color:var(--faint);font-family:var(--cjk);font-size:.78rem;line-height:1.7}

/* 轻承诺（check） */
.check{margin:1.05rem 0;padding:.75rem .95rem;border:1px dashed var(--line);border-radius:4px}
.check .chl{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;color:var(--faint);margin-bottom:.42rem}
.check .chq{font-family:var(--cjk);font-size:.9rem;color:var(--txt);line-height:1.8}
.check .cha{font-family:var(--cjk);font-size:.86rem;color:var(--gold);line-height:1.8;margin-top:.5rem}
.check .cha::before{content:"参考 · ";color:var(--faint);font-family:var(--mono);font-size:.6rem;letter-spacing:.1em}
.check .creveal{margin-top:.5rem;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;color:var(--dim);cursor:pointer}
.check .creveal:hover{color:var(--gold)}
.mc{margin:1.05rem 0;padding:.75rem .95rem;border:1px dashed var(--line);border-radius:4px}
.mc .mcl{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;color:var(--faint);margin-bottom:.42rem}
.mc .mcq{font-family:var(--cjk);font-size:.9rem;color:var(--txt);line-height:1.8;margin-bottom:.3rem}
.mc .mcp{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;color:var(--faint);margin-top:.4rem}
.row.hot1{border-left-color:rgba(216,191,138,.14)} /* 真题热度左标：金要淡，信息在悬读 */
.row.hot2{border-left-color:rgba(216,191,138,.32)}
/* 生成图视图（AP 提案5）：body.gv 下墙面按「母关/挂活/有边未活/孤立」显影；热度左标让位 */
body.gv .row{opacity:.32;border-left-color:transparent}
body.gv .row.gvp{opacity:.55}
body.gv .row.gvl{opacity:1}
body.gv .row.gvg{opacity:1;border-left-color:rgba(216,191,138,.55)}
body.gv #gvn{color:var(--gold);border-color:#3a3524}
.exchip{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;color:#8a7a4a;cursor:pointer;border:1px solid #2a2618;padding:.1rem .5rem;border-radius:3px}
.exchip:hover{color:var(--gold);border-color:#3a3524}
.dstem{font-family:var(--cjk);font-size:.92rem;line-height:1.9;color:var(--s1);margin:.6rem 0}
.dmeta{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--faint);margin-top:1.4rem}
.dans{border-left:2px solid #3a3524;padding:.5rem .9rem;margin:.7rem 0;color:var(--s1);font-family:var(--cjk);font-size:.9rem;line-height:1.9}
.dfig{color:var(--dim);font-family:var(--cjk);font-size:.82rem;border:1px dashed var(--line);padding:.45rem .8rem;margin:.5rem 0}
.nbtn.seal[disabled]{border-color:var(--line);color:var(--faint);background:none} /* 金要挣来：闸未过时收墙键彻底安静 */

/* toast */
#toast{position:fixed;left:50%;bottom:4.5rem;transform:translateX(-50%);z-index:60;
  font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;color:var(--gold);
  border:1px solid #3a3524;background:rgba(10,13,21,.94);padding:.5rem 1.2rem;border-radius:4px;
  opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}

/* selftest / fatal */
#st{position:fixed;left:0;right:0;top:0;z-index:99;background:#090b11;border-bottom:1px solid #262a33;
  padding:1rem 1.4rem;font-family:var(--mono);font-size:12px;line-height:1.7;color:#aab;white-space:pre-wrap;
  max-height:94vh;overflow-y:auto;user-select:text}
#st.bad{color:#e08585;border-bottom-color:#5a2727}

/* 手机竖屏（静态流墙）—— 判据仍是 ≤900px：iPhone 横屏 844 天然命中；
   iPad（触屏但 ≥901px）**不**入此块——墙照旧走桌面 fixed 多列（P16 件七 A3），
   只有纯读件与移动首页头随 (pointer:coarse) 升级（见下两块）。 */
@media(max-width:900px){
  body{overflow-y:auto;height:auto}
  /* P15 件六 · 顶部堆叠修理：#hud 由 fixed 改静态入流——右上钮组（倒计时/推导地图/真题册/触发器/错题档/←刷题）
     一旦折成两三行（大字号必然），fixed 定高的老写法就压在「今日安排」上叠字。入流后各行自占位，永不重叠。 */
  #hud{position:static;padding:.7rem 1.1rem .4rem}
  html.kysa #hud{top:auto}
  #wall{position:static;display:block;padding:.6rem 1.1rem 4rem;height:auto}
  .band{margin-bottom:1.6rem}
  .clusters{display:block}
  .cluster{border-left:none;padding-left:0;margin-bottom:1rem}
  .cells{overflow:visible;mask-image:none;-webkit-mask-image:none}
  .row{padding:.2rem .1rem .2rem .5rem}
  .row .rt{white-space:normal}
  #read{display:none}
  #plan{position:static;padding:.15rem 1.1rem .45rem;row-gap:.4rem} /* 2.7rem 顶距是给 fixed #hud 让位的，入流后归零 */
  #rin{padding-top:3.4rem}
  #wtop{padding-bottom:.35rem}
}

/* 手机窄屏舒适档（AN：500 钳下抬字号基准/亮灰阶下限/放大触点/避 iOS 安全区；
   纯黑克制纲领不破——灰仍是灰，只抬下限；公式长于屏改容器内滚，滚动条全局已隐） */
@media(max-width:520px){
  html,body{font-size:calc(18.5px * var(--fz,1))}
  /* P16 件二 · 窄屏钳（viewport width=500）内 env() 按 CSS px 报数、页面又被放大 500/428≈1.17 倍，
     故安全区在钳内乘 1.2 补偿（照 vocab 追记十三实测值）；出钳区（>520）恒等不补。 */
  :root{--dim:#7b8191;--faint:#4b515d;--faint2:#363c48;
        --sat:calc(env(safe-area-inset-top,0px)*1.2);--sab:env(safe-area-inset-bottom,0px)}
  #plan{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-right:1.6rem}
  #plan .chip{flex:none}
  .row{padding:.34rem .1rem .34rem .5rem}
  .row .rt{font-size:.84rem}
  .chd{font-size:.76rem}
  .bl{font-size:.8rem}
  .rbody{font-size:.99rem;line-height:2.02}
  .sech{font-size:1.12rem}
  .mc .mcq{font-size:.99rem}
  .check .chq{font-size:.99rem}
  .opt{padding:.78rem .95rem}
  .nbtn{padding:.72rem 1.55rem}
  #rin{padding:1.1rem .95rem calc(8.5rem + var(--sab))}
  #rtop{position:sticky;font-size:.68rem;background:var(--paper);border-bottom:1px solid var(--faint2);
    padding-top:calc(.55rem + var(--sat));padding-bottom:.5rem} /* 大字号自涨自占位，永不压正文 */
  #rnav{flex-wrap:wrap;row-gap:.45rem;gap:.7rem;padding-bottom:calc(1.05rem + var(--sab))}
  #hudr{flex-wrap:wrap;justify-content:flex-end;row-gap:.2em}
  .qrow{display:block;padding:.42rem 0} /* 窄屏改上下两行：题行+注行，任何字号不挤竖条 */
  .qrow .qt{display:block;width:auto;white-space:normal}
  .qrow .qtr{display:block;margin-top:.1rem}
  #fzctl{font-size:11px;right:12px;bottom:calc(8px + var(--sab))} /* 控件不随字号长个，缩进角落 */
  .rbody .katex-display{overflow-x:auto;overflow-y:hidden;padding-bottom:.15rem}
  .skx{overflow-x:auto}
  .ctab{overflow-x:auto}
  .trig .tt{font-size:.92rem}
  .figsay{font-size:.99rem;line-height:2.0;min-height:3.9em}  /* 图讲：随窄屏舒适档抬字号，最小高同步 */
  .fdot{padding:.55rem .42rem}                                 /* 触点放大（步进点 tap 得中） */
  .fnav{padding:.5rem .2rem}
  .drvk{font-size:1.02rem}
  .drvh{font-size:.86rem;padding:.5rem 0}
  .sqi{font-size:.95rem;line-height:2.02}
}

/* ————— 移动纯读（P15 件三 · ≤820px；桌面 ≥821px 分毫不动）—————
   用户亲令口径：「点开一个页面上面固定占了好几行、下面又固定占个下一拍——顶上收进最多两行且平常不显示，
   下一拍放到页面底部，要 Apple Books 的浏览效果、纯内容」。
   落地：①#rtop 常态只剩一条极细行（关名 ellipsis ＋ ⋯ 展开钮 ＋ ✕），tap ⋯ 才展开 ≤2 行完整信息条
        （关型/拍序/真题入口/字号器），恒不随滚动自弹；②#rnav 固定条撤，导航渲进 #rnavin＝内容流末尾；
        ③#fzctl 浮钮在房内让位（并入展开条），墙面/册子页照旧原位。全程零新动画。
   P16 件六：判据升级为「≤820px 或 (pointer:coarse)」——iPhone 横屏（844~932px）此前掉出断点走桌面布局，
        是「横竖屏都一样」的病根；并增 body.clean 纯净态：房内 tap 空白藏尽 chrome，只剩内容，再 tap 恢复细行。 */
@media(max-width:820px),(pointer:coarse){
  #rtop{position:sticky;top:0;z-index:42;display:flex;flex-wrap:nowrap;align-items:center;gap:.45rem;
    font-size:.66rem;background:var(--paper);border-bottom:1px solid var(--hair);
    padding:calc(.32rem + var(--sat)) .9rem .32rem}
  #rtop .rtx{display:none}
  #rtop .rtg{display:none}                     /* 常态：信息件整组不在场（一条极细行到底） */
  /* 展开态＝两行网格（不是换行 flex）：第一行 关名｜⋯｜✕ 恒定三格，第二行 .rtg 独占。
     网格保证「任何字号下恰两行」——字号再大只让关名省略号，绝不涨第三行（fz2.4 亦然）。 */
  #rtop.exp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;
    column-gap:.45rem;row-gap:.28rem;padding-bottom:.5rem;border-bottom-color:var(--faint2)}
  #rtop.exp .rtx{display:inline-flex}
  #rtop.exp .rti{grid-column:1;grid-row:1}
  #rtop.exp .rtmore{grid-column:2;grid-row:1}
  #rtop.exp .rx{grid-column:3;grid-row:1}
  #rtop.exp .rtg{grid-column:1/-1;grid-row:2;display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    align-items:center;gap:.55rem;min-width:0}  /* 第二行：装下全部信息件，长了自己横滚 */
  #rtop.exp #beats{flex-wrap:nowrap;flex:none;white-space:nowrap}
  #rtop.exp .rtg .exchip{order:-2;flex:none}    /* 该行内可点的排前面：大字号下横滚也先够得着「真题」与字号 */
  #rtop.exp .rtg .rtfz{order:-1;flex:none}
  #rtop.exp .rtg .rk{flex:none}
  #rtop .rti{flex:1 1 auto;min-width:0;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #rtop .rtmore{display:inline-block;flex:none;color:var(--dim);font-size:.95rem;letter-spacing:.1em;
    line-height:1;padding:.2rem .45rem}
  #rtop .rtmore:hover{color:var(--txt)}
  #rtop .rx{margin-left:0;flex:none;padding:.1rem .1rem .1rem .25rem}
  #rtop.exp .rtfz{display:inline-flex;align-items:center;gap:.5rem;color:var(--faint)}
  #rtop .rtfz span{cursor:pointer;padding:.1rem .25rem}
  #rtop .rtfz span:hover{color:var(--dim)}
  #rin{padding:1.05rem .95rem calc(3.4rem + var(--sab))}
  #rnav{display:none}
  #rnavin{display:flex;padding-bottom:calc(.2rem + var(--sab))}
  body.rmopen #fzctl{display:none}   /* 房内字号器并入展开信息条；墙面与册子页照旧浮钮 */
  /* P16 件三 · 目录行（只在收墙关＝回看态渲染）：常态随信息件一起收起，展开态占第三行横滚不折行 */
  #rtop .rtoc{display:none}
  #rtop.exp .rtoc{grid-column:1/-1;grid-row:3;display:flex;flex-wrap:nowrap;overflow-x:auto;
    overflow-y:hidden;align-items:center;gap:.34rem;min-width:0;padding-top:.1rem;
    border-top:1px solid var(--hair)}
  /* P16 件六 · 纯净态：tap 空白即藏尽 chrome（顶条与云档钮），只剩内容；再 tap 恢复细行。
     零动画、纯内存（body 类，不落盘）；进房默认非纯净态（可发现性）。 */
  body.clean #rtop{display:none}
  body.clean #kysync-btn{display:none}
}

/* ————— P16 件一 · 移动首页（≤820px 才现身；桌面 ≥821px 分毫不动）—————
   四行定死：①「数学宇宙」＋距初试（不折行）②chip 排横向内滚（速查/真题册/触发器/错题档/刷题/单独记/?）
   ③续学卡（石黑底＋左缘金竖线，主行=接着学、副行=到期复习）④读数行（未学·日均·天数·已学，一行内滚）。
   图例与字号器收进「?」弹层（tap 外即关、零动画）；桌面 #hud/#wtop/#fzctl 原位一像素不动。 */
#mhead{display:none;padding:.5rem 1.1rem .1rem}
.mh1{display:flex;align-items:baseline;justify-content:space-between;gap:.7rem;
  overflow-x:auto;overflow-y:hidden}   /* 极端字号（fz2.4）下两件挤不下：整行自己横滑，绝不折行 */
.mh1 .mbr{font-family:var(--cjk);font-size:1.02rem;letter-spacing:.32em;color:var(--faint);
  white-space:nowrap;flex:none}
.mh1 .mcd{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;color:var(--faint);
  white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.mh1 .mcd b{color:var(--gold);font-weight:400}
#mchips{display:flex;flex-wrap:nowrap;align-items:center;gap:.4rem;margin-top:.52rem;
  overflow-x:auto;overflow-y:hidden;padding-bottom:.08rem;
  /* 右缘渐隐＝可滑暗示（同墙 .cells 的手法，无可见滚动条纲领不破）；装得下时最后一枚离右缘远，无感 */
  mask-image:linear-gradient(90deg,#000 92%,transparent);
  -webkit-mask-image:linear-gradient(90deg,#000 92%,transparent)}
.mchip{flex:none;font-family:var(--cjk);font-size:.72rem;letter-spacing:.06em;color:var(--dim);
  border:1px solid var(--line);padding:.26rem .66rem;border-radius:3px;white-space:nowrap;
  text-decoration:none;display:inline-block;line-height:1.35}
.mchip.mq{font-family:var(--mono);letter-spacing:0;padding:.26rem .6rem}
.mchip:active{color:var(--s1);border-color:#242a35}
#mgo{margin-top:.58rem;border-left:2px solid var(--gold);background:var(--chrome);padding:.48rem .78rem}
#mgo .g1{display:block;width:100%;font-family:var(--cjk);font-size:.86rem;color:var(--txt);
  line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mgo .g1 i{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;color:var(--gold);margin-right:.5rem}
#mgo .g2{display:block;width:100%;margin-top:.26rem;font-family:var(--mono);font-size:.6rem;
  letter-spacing:.1em;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mgo .g2 b{color:var(--dun);font-weight:400}
#mread{margin-top:.48rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;color:var(--faint);
  white-space:nowrap;overflow-x:auto;overflow-y:hidden;font-variant-numeric:tabular-nums}
#mhelp{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;
  align-items:center;justify-content:center;padding:1.1rem}
.mhbox{width:100%;max-width:28rem;max-height:78vh;overflow-y:auto;background:var(--chrome);
  border:1px solid var(--line);border-radius:4px;padding:.85rem .95rem}
.mhbox .mht{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;color:var(--faint);margin-bottom:.5rem}
.mhbox .mfz{display:flex;align-items:center;gap:.9rem;margin-top:.7rem;padding-top:.6rem;
  border-top:1px solid var(--hair);font-family:var(--mono);font-size:.72rem;
  letter-spacing:.1em;color:var(--dim);font-variant-numeric:tabular-nums}
.mhbox .mfz span{cursor:pointer;padding:.24rem .5rem;border:1px solid var(--line);border-radius:3px}
.mhbox .mgvn{margin-top:.6rem;font-family:var(--cjk);font-size:.68rem;line-height:1.75;color:var(--faint)}

/* ————— P16 件五 · 横向溢出治理（房内左右滑到空白＝没质感）—————
   两层都做：①元素级内滚保「看得全」——KaTeX 独立式统一容器化（旧规则只覆盖 .rbody，
   真题题面 .dstem/生题 .revq/微测 .mcq/推导卡 .drvk 里的独立式无人管，正是撑宽真凶）；
   ②文档级兜底保「晃不动」——html/body 与房/册子容器横滚归零。 */
.katex-display{max-width:100%;overflow-x:auto;overflow-y:hidden}
body{overflow-x:hidden}
#room,#page,#rin,#pin,#wall{overflow-x:hidden}
.dstem,.dans,.revq,.mcq,.chq,.cha,.drvk,.drvt,.trig .tt,.sqi,.opt,.figsay,.rbody,
.step .sdo,.step .swhy,.atom .ac,.atom .req,.track .tk,.pit .pw,.pit .py{max-width:100%}
/* 行内长内容（行内式/删线病笔/金强调串）撑破段落时才挂 .xscroll＝那一段自己横滚。
   由 fitWide() 量出实况后挂类——不给全体段落无差别加 overflow（那会把行内分式的上下沿切掉），
   只有真超宽的少数段落变内滚容器，并留 .2em 底衬吸收行内式的纵向溢出。 */
.xscroll{overflow-x:auto;overflow-y:hidden;padding-bottom:.2em}

/* ————— P18 件一 · 文档滚动锁（治「上滑时下方冒大块黑块阻挡内容」）—————
   定罪（实测）：移动端墙走静态流（@media≤900 的 body{height:auto;overflow-y:auto}），body 因此长达数千 px
   （k_gs1_01 实测 6792px）；进房/进册子只设了 body.style.overflow="hidden"，而 html{overflow-x:hidden}
   已让 html 的 overflow-y 计算成 auto ⇒ 按 CSS 规范 body 的 overflow 不再传播到视口、**根滚动器是 html**，
   于是房开着时文档照样能滚整整一堵墙（实测 documentElement.scrollTop=300 生效）。
   iOS 上根文档一旦可滚：①Safari 才会在上滑时收放地址栏 ②惯性滚动期间 position:fixed 的 #room/#page
   随视觉视口漂移且不实时重绘 ⇒ 屏幕下方露出等高的 body 纯黑底、内容不再跟着走＝用户说的「大块黑块阻挡」。
   修：开房/开册子即 docLock(true) 两保——①根滚动器 overflow:hidden 锁死（标准解）②移动静态流墙三件收起，
   body 高度物理塌成 0（iOS 万一忽略 html{overflow:hidden}，也根本无处可滚）；退出即解锁并复原原滚动位置。
   桌面/iPad（>900px 墙本就 fixed、body height:100vh overflow:hidden）文档本无可滚高度，此锁对其恒等无副作用。 */
html.lockdoc{overflow:hidden}
html.lockdoc body{overflow:hidden}
@media(max-width:900px){html.lockdoc #mhead,html.lockdoc #plan,html.lockdoc #wall{display:none}}

@media(max-width:820px),(pointer:coarse){
  #mhead{display:block}
  #hud{display:none}                 /* 内容由 #mhead 接管（标题/倒计时/册子入口） */
  #wall #wtop{display:none}          /* 速查 chip 已入排、图例已入「?」弹层 */
  #plan .pgo{display:none}           /* 读数已上行四，安排牌里不再重复 */
  #plan{padding:.1rem 1.1rem .5rem}
  #wall{padding:.35rem 1.1rem 4.6rem}
  #fzctl{display:none}               /* A± 收进「?」弹层 */
  body.pgopen #fzctl{display:flex}   /* 册子页仍留浮钮（房内 P15 已并入展开条） */
  body #kysync-btn{right:6px;bottom:calc(6px + var(--sab))}          /* 首页：收右下角贴底，不压内容 */
  body.rmopen #kysync-btn,body.pgopen #kysync-btn{right:10px;bottom:calc(44px + var(--sab))}
  /* P19 建构图：移动端单列，详情面板由右侧栏改为 sticky 贴底条（图占满宽，读图与读解释不抢地方）。
     底衬留出 ⇅／A± 浮钮的高度，按钮永不被压。 */
  .mapv{grid-template-columns:minmax(0,1fr);gap:.3rem}
  .mappan{position:sticky;top:auto;bottom:0;border:none;border-top:1px solid var(--line);
    border-radius:0;min-height:5rem;background:var(--paper);
    padding:.55rem .2rem calc(1.9rem + var(--sab));
    max-height:42vh;overflow-y:auto;overscroll-behavior:contain}   /* 极端字号下面板不吞屏（fz2.4 实测 427px），超出自己内滚 */
}

/* ————— P16 件七 A · iPad（触屏且 ≥901px：iPad Pro 12.9 竖 1024 / 横 1366，含分屏 981）—————
   ①墙照旧走桌面 fixed 多列（不入 ≤900 静态流块）；②移动首页头 #mhead 与安排牌回落文档流、
   浮在墙之上（z-index 28 > #wall），墙顶由 fitPlan 垫到牌底之下——与桌面同一套「牌与墙不叠压」机制；
   ③房内/册子内容列收到 46rem 居中（12.9 横屏一行五六十字＝行长过长，Apple Books 同做法；
   桌面鼠标端照旧 62rem、4K 72rem，口径不同是有意的）。 */
@media(pointer:coarse) and (min-width:901px){
  #mhead{position:relative;z-index:28;padding:.6rem 1.8rem .1rem}
  #plan{position:static;padding:.15rem 1.8rem .45rem}
  #wall{padding:3.35rem 1.8rem 2.4rem}      /* padding-top 由 fitPlan 按牌底动态覆写 */
  #rin,#pin{max-width:46rem}
  .mh1 .mbr{font-size:1.16rem}
  #mgo{padding:.55rem .9rem}
}
/* P20：知识图谱在 iPad **竖屏**（901~1100）改单列——侧栏一占图只剩 ~660px，
   在「不压字」的单位下限下必横滚，与 SPEC「iPad 全图一屏」相悖；图占满宽才谈得上一屏。
   横屏（≥1101）容器 950+ 装得下，照旧两列（读图与读解释不来回切）。 */
@media(pointer:coarse) and (min-width:901px) and (max-width:1100px){
  .mapv{grid-template-columns:minmax(0,1fr);gap:.5rem}
  .mappan{position:static;min-height:6rem}
}

/* ————— 桌面端右上角可读性（AQ 工位一）—————
   #hudr（#cd + 独维/真题册/速查/错题档/←刷题）与关卡页右上 .pback 由 .76em/.66rem 提到 .8rem
   起——rem 基准，随 --fz 旋钮整体缩放。只在 ≥901px 生效：两处手机 @media 块（AP2 大字加固）
   分毫不动，手机端字号与折行照旧。灰阶克制不变（色值一律未改）。 */
@media(min-width:901px){
  #hudr{font-size:.8rem}
  .pback{font-size:.8rem}
}

/* ————— 4K/高分屏字号（WE 桌面壁纸 3840×2160 字太小 → 放大 rem 基准；
   rem-only 布局跨字号自相似；墙章簇框 .cells 放大溢出即内部滚动，「整墙一屏」不破）
   ——— 24/33px 同乘 var(--fz) 保留手动旋钮（只加不改基准；旋钮域 0.7~2.4） ————— */
@media(min-width:2200px){
  html{font-size:calc(24px * var(--fz,1))}body{font-size:calc(24px * var(--fz,1))}
  /* 4K 宽版：仅内容列再加档；拍序导航（#rtop）保持顶部原样式，不改布局 */
  #rin{max-width:72rem}
  #pin{max-width:72rem}
}
@media(min-width:3200px){html{font-size:calc(33px * var(--fz,1))}body{font-size:calc(33px * var(--fz,1))}}

<script>
"use strict";
/* ===================== 微工具 ===================== */
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var DAY=86400000;
var Q=new URLSearchParams(location.search);
var ST=Q.has("selftest");
var SEEDED=Q.has("seed");
function now(){return Date.now();}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fatal(m){var st=$("#st");st.classList.remove("hide");st.classList.add("bad");
  st.textContent+=(st.textContent?"\n":"")+m;}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");
  setTimeout(function(){t.classList.remove("on");},1600);}

/* ===================== 数据加载（__MATH 校验） ===================== */
var M=window.__MATH||null;
if(!M||!Array.isArray(M.levels)||!M.levels.length){fatal("MATH FATAL · __MATH 未加载（math_data.js 缺失或损坏）");}
var LEVELS=(M&&M.levels)||[];
var CHAPTERS=(M&&M.chapters)||[];
var ATOMS=(M&&M.atoms)||{};
var ATOMSET=Object.keys(ATOMS);
var GENMAP=(M&&M.genmap)||{generators:{},edges:{}}; /* 第二张图：生成关系（AP 提案5） */
/* 速查册（P15 件二）：build 期由 tools/math/formulas.json 注入；缺件＝空册（构建告警不失败）。
   取值走函数而非快照——调试/自测可就地换册（window.__MATH.formulas=…）立即生效。 */
function formBook(){var f=M&&M.formulas;return (f&&Array.isArray(f.chapters))?f:{chapters:[]};}

/* ===================== 索引（关卡/章/原子三索引 + covers 反查） ===================== */
var byId={},chById={},byChapter={};
LEVELS.forEach(function(l){byId[l.id]=l;});
CHAPTERS.forEach(function(c){chById[c.id]=c;});
LEVELS.forEach(function(l){(byChapter[l.chapter]=byChapter[l.chapter]||[]).push(l);});
Object.keys(byChapter).forEach(function(k){byChapter[k].sort(function(a,b){return a.id<b.id?-1:1;});});
var SUBJECTS=[
  {id:"gs",name:"高　数",chs:CHAPTERS.filter(function(c){return c.id.indexOf("gs")===0;}).map(function(c){return c.id;})},
  {id:"xd",name:"线　代",chs:CHAPTERS.filter(function(c){return c.id.indexOf("xd")===0;}).map(function(c){return c.id;})},
  {id:"gl",name:"概　率",chs:CHAPTERS.filter(function(c){return c.id.indexOf("gl")===0;}).map(function(c){return c.id;})}
];
var CN_NUM=["","一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四"];
function chNumeral(chid){var m=chid.match(/\d+/);return m?(CN_NUM[+m[0]]||m[0]):"";}
var atomToLevels={};
LEVELS.forEach(function(l){(l.covers||[]).forEach(function(a){(atomToLevels[a]=atomToLevels[a]||[]).push(l.id);});});

/* ===================== 存档（ky_math_v1 + ky_math_wrong_v1；freshState/loadState 迁移，铁律6） ===================== */
var SAVE="ky_math_v1",WRONG="ky_math_wrong_v1";
/* 复习间隔·天（宪法四：晋阶只认生题，桥件只续间隔）。
   AQ 工位五 v2（用户 2026-07-28 二次亲令）：1/3/7/14/30/60 → 2/7/20——宇宙生命周期不足百日，
   战线不拉长：学后第 2/7/20 天各一触，末触判对即收口（due 置 0＝不再排期，此后永不转蒙尘）。
   旧档 due 不迁移，下次判对自然入新序（旧 g 超界者按末触处理，即刻收口）。 */
var INT=[2,7,20];
var NEWPD=4;   /* 今日安排 · 新关日均（推荐张数与「≈M 天学完」读数同源，改一处即同步） */
function intAt(g){var i=Math.max(0,Math.min(INT.length-1,g|0));return INT[i];} /* 越界钳（旧档 g 可达 5） */
function isLastRung(g){return (g||0)>=INT.length-1;} /* 末触位：判对即收口 */
var S,WB;
/* P16 件三：meta.lastk={k,ts}＝应用级「上次在哪一关」指针（开房写、关房清）；
   case.pos={p,a,ts}＝关内「上次在哪一拍、拍内哪个锚」。两者都是用户位置而非派生态，
   故落盘合法（投影律管的是进度色/到期态那类可重算的东西）。云档 mMath 逐 case 整对象取新、
   meta 整体按 last 取新 ⇒ 两者免费搭车，sync_core.js 公共正本零改动。 */
function freshState(){return {cases:{},meta:{examDate:"",snd:true,last:0,ver:1,lastk:null}};}
function ensureCase(id){var c=S.cases[id];if(!c){c={due:0,hits:[],seen:0,g:0,star:false,mc:{},dr:{},pos:null};S.cases[id]=c;}if(!c.mc||typeof c.mc!=="object")c.mc={};if(!c.dr||typeof c.dr!=="object")c.dr={};if(c.pos===undefined)c.pos=null;return c;}
function loadState(){
  var f=freshState();
  try{S=JSON.parse(localStorage.getItem(SAVE));}catch(e){S=null;}
  if(!S||typeof S!=="object")S=f;
  if(!S.cases||typeof S.cases!=="object")S.cases={};
  if(!S.meta||typeof S.meta!=="object")S.meta={};
  Object.keys(f.meta).forEach(function(k){if(!(k in S.meta))S.meta[k]=f.meta[k];});
  Object.keys(S.cases).forEach(function(id){
    var c=S.cases[id];
    if(typeof c.due!=="number")c.due=0;
    if(!Array.isArray(c.hits))c.hits=[];
    if(typeof c.seen!=="number")c.seen=0;
    if(typeof c.g!=="number")c.g=0;
    if(typeof c.star!=="boolean")c.star=false;
    if(!c.mc||typeof c.mc!=="object")c.mc={}; /* AK 微测档迁移 */
    if(!c.dr||typeof c.dr!=="object")c.dr={}; /* AO 真题档迁移 */
    /* P16 续学位迁移（铁律6）：缺省补 null，坏件（非对象/p 非数）一律作废回 null */
    if(c.pos===undefined||c.pos===null)c.pos=null;
    else if(typeof c.pos!=="object"||Array.isArray(c.pos)||typeof c.pos.p!=="number")c.pos=null;
  });
  /* P16 应用级指针迁移：坏件作废（此时尚无 byId 索引，关 id 是否在库留给路由时判） */
  if(S.meta.lastk&&(typeof S.meta.lastk!=="object"||Array.isArray(S.meta.lastk)
     ||typeof S.meta.lastk.k!=="string"||!S.meta.lastk.k))S.meta.lastk=null;
  /* ===== P16 事故勘误（PROGRESS AS 案）：剔除 2026-08-05 03:20UTC 测试误写云档的假记录，
     精确时戳匹配；2026-09 后可整段删除。 =====
     假记录已随同步进过各设备本地档，云端直删会被设备端按 max(hits[].t) 判新冲回，故治本＝壳内
     一次性精确勘误：每台设备 loadState 时自愈，之后正常同步把净化版顺合并律推上云。只动
     k_gs1_07 一案、只认下列固定时戳，二次执行无匹配即空转＝天然幂等。 */
  (function(){
    var BADH=[1785900049308,1785900051583,1785900052526,1785900053468,
              1785900054400,1785900055320,1785900056240];               /* 7 条假 hits */
    var BADM=[1785900051583,1785900052526,1785900053468,
              1785900054400,1785900055320];                             /* 5 个假 mc 键（按值 .t 认，不认键名） */
    var c=S.cases["k_gs1_07"];
    if(c){
      if(Array.isArray(c.hits))c.hits=c.hits.filter(function(h){return !(h&&BADH.indexOf(h.t)>=0);});
      if(c.mc&&typeof c.mc==="object")Object.keys(c.mc).forEach(function(k){
        var v=c.mc[k];if(v&&typeof v==="object"&&BADM.indexOf(v.t)>=0)delete c.mc[k];
      });
      if(c.pos&&c.pos.ts===1785900057165)delete c.pos;                  /* 假续学位 */
    }
    /* 假应用级指针：ts 精确匹配已是最强闸，不依赖该案卷是否还在（清过档的设备也应清指针） */
    if(S.meta.lastk&&S.meta.lastk.ts===1785900232826)S.meta.lastk=null;
  })();
  try{WB=JSON.parse(localStorage.getItem(WRONG))||{};}catch(e){WB={};}
  if(!WB||typeof WB!=="object")WB={};
  /* ===== P21 gs6 拆关重编迁移（铁律6；合川 2026-08-10）：旧 8 关档→新 10 关号。
     旧01(二重)/旧04(格林+路径无关) 各拆两关，旧档进度保守落拆对的 a 关（=同号01/新05）；
     其余顺移。快照后统一改名防链式覆盖（旧02→03 与旧03→04 同时在场）。二次执行无旧键即空转＝幂等。 */
  (function(){
    var MAP={"k_gs6_02":"k_gs6_03","k_gs6_03":"k_gs6_04","k_gs6_04":"k_gs6_05",
             "k_gs6_05":"k_gs6_07","k_gs6_06":"k_gs6_08","k_gs6_07":"k_gs6_09"};
    function ren(obj){
      var hit=Object.keys(obj).filter(function(k){return MAP[k];});
      if(!hit.length)return;
      var snap={};hit.forEach(function(k){snap[k]=obj[k];delete obj[k];});
      hit.forEach(function(k){var nk=MAP[k];if(!(nk in obj))obj[nk]=snap[k];});
    }
    ren(S.cases);ren(WB);
    if(S.meta.lastk&&MAP[S.meta.lastk.k])S.meta.lastk.k=MAP[S.meta.lastk.k];
  })();
}
function save(){if(SEEDED)return;S.meta.last=now();
  try{localStorage.setItem(SAVE,JSON.stringify(S));localStorage.setItem(WRONG,JSON.stringify(WB));}catch(e){}}

/* ===================== 进度派生（纯函数·投影律：进度态渲染时算，永不落盘） ===================== */
function progressOf(id,t){
  var c=S.cases[id];
  if(!c||!c.seen)return "unlearned";
  var gotFresh=c.hits.some(function(h){return h.kind==="生题"&&h.ok;});
  if(gotFresh){
    if(c.due&&c.due<t)return "dusty";
    return "mastered";
  }
  return "learned";
}
function progressMap(t){var m={};LEVELS.forEach(function(l){m[l.id]=progressOf(l.id,t);});return m;}
function stateClass(st){return ({unlearned:"s0",learned:"s1",mastered:"s2",dusty:"s2 due"})[st]||"s0";}
function reviewKind(c,l){
  var hits=(c&&c.hits)||[];
  var mastered=hits.some(function(h){return h.kind==="生题"&&h.ok;});
  var used=hits.filter(function(h){return h.kind==="生题";}).length;
  if(!mastered&&used<((l.fresh||[]).length))return {kind:"生题",idx:used,mastered:false};
  return {kind:"桥件",idx:0,mastered:mastered};
}

/* ===================== KaTeX 渲染器（微标记八种 → HTML） ===================== */
/* 七种英语侧微标记：换行段、连字列表、数字步骤块、引用块、金强调、式样框、病笔删线；
   第八种数学侧行内式与独立式（KaTeX 走渲染管线最后一趟，throwOnError:false 降级红字源码）。
   转义：反斜杠加美元显字面；反引号内禁美元号（冲突反引号胜，代码先抽出保护）。 */
function renderTex(tex,display){
  if(window.katex){
    try{return katex.renderToString(String(tex),{displayMode:!!display,throwOnError:false});}
    catch(e){return '<span class="katex-error">'+esc(tex)+"</span>";}
  }
  return '<span class="kx-raw">'+esc(tex)+"</span>"; /* 删 vendor 即回落纯文本 */
}
function inlineMd(s){
  s=String(s==null?"":s);
  var math=[],code=[];
  s=s.replace(/\\$/g,"@@D@@");                                                                     /* 1 保护转义 \$ */
  s=s.replace(/`([^`]+)`/g,function(m,c){code.push(c);return "@@C"+(code.length-1)+"@@";});         /* 2 抽反引号（禁 $，冲突反引号胜） */
  s=s.replace(/\$\$([\s\S]+?)\$\$/g,function(m,t){math.push({t:t,d:true});return "@@M"+(math.length-1)+"@@";});  /* 3a 独立式 */
  s=s.replace(/\$([^\$]+?)\$/g,function(m,t){math.push({t:t,d:false});return "@@M"+(math.length-1)+"@@";});      /* 3b 行内式 */
  s=esc(s);                                                                                          /* 4 esc 其余（KaTeX/代码已抽出保护） */
  s=s.replace(/~~([^~]+)~~/g,"<del>$1</del>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");     /* 5 病笔删线 / 金强调 */
  s=s.replace(/@@C(\d+)@@/g,function(m,i){return "<code>"+esc(code[+i])+"</code>";});               /* 6 还原代码 */
  s=s.replace(/@@M(\d+)@@/g,function(m,i){return renderTex(math[+i].t,math[+i].d);});                /* 7 还原 KaTeX（渲染管线最后一趟） */
  s=s.replace(/@@D@@/g,"$");                                                                         /* 8 还原字面 $ */
  return s;
}
/* rt 第二参 ns＝批注挂载器（P21B，选配；缺席即老路，输出逐字节不变）：
   块级出栈时把 @@N<k>@@ 占位符换成夹批小标，并把该条批注块紧接着这一块推出去
   ⇒ 批注永远落在「锚所在的那一段（或那一整个列表/引用块）之后」，绝不塞进 <p>/<li> 内部。 */
function rt(text,ns){
  var out=[],ul=null,ol=null,q=null;
  function push(x){
    if(!ns){out.push(x);return;}
    var hit=[];
    x=x.replace(/@@N(\d+)@@/g,function(m,i){i=+i;if(!ns[i])return "";hit.push(i);return ns[i].mk;});
    out.push(x);
    for(var j=0;j<hit.length;j++)out.push(ns[hit[j]].bk);
  }
  function flush(){
    if(ul){push("<ul>"+ul.map(function(x){return "<li>"+inlineMd(x)+"</li>";}).join("")+"</ul>");ul=null;}
    if(ol){push('<ol class="steps">'+ol.map(function(x){return "<li>"+inlineMd(x)+"</li>";}).join("")+"</ol>");ol=null;}
    if(q){push("<blockquote>"+q.map(function(x){return inlineMd(x);}).join("<br>")+"</blockquote>");q=null;}
  }
  String(text==null?"":text).split("\n").forEach(function(line){
    if(line.indexOf("- ")===0){if(ol||q)flush();(ul=ul||[]).push(line.slice(2));return;}
    var mo=line.match(/^\d+\.\s+(.*)$/);
    if(mo){if(ul||q)flush();(ol=ol||[]).push(mo[1]);return;}
    if(line.indexOf("> ")===0){if(ul||ol)flush();(q=q||[]).push(line.slice(2));return;}
    flush();
    if(line.trim())push("<p>"+inlineMd(line)+"</p>");
  });
  flush();
  return out.join("");
}

/* ===================== 墙渲染（三科三横带 → 章簇 → 关格） ===================== */
/* 墙顶图例（AQ 工位三）：常驻一行，微件即真实渲染件——2px 左线取 .row.hot1/.hot2 的边色，
   3px 左点取 .row.due::after 的 #4e4939，右侧圆点取 .row .dots b 的四态色（未学 --faint2 /
   学过 #565b64 / 精通 --gold / 过期 --dun）。热度阈值与 buildWall 同源：hp>=4 淡金、hp>=9 明金。 */
/* 图例正文（P16 件一：桌面常驻墙顶、移动收进「?」弹层，两处同一份，改一处即同步） */
var LGD='<div class="lgd">'
  +'<i>左线真题热度<s><u class="h1"></u>主考 4 次+</s><s><u class="h2"></u>9 次+</s></i><em>｜</em>'
  +'<i><s><b class="dd"></b>左点</s>到期待复习</i><em>｜</em>'
  +'<i><s><b></b><b></b><b></b>右点</s>覆盖考点数</i>'
  +'<i>色随行<s><b></b>未学</s><s><b class="l1"></b>学过</s><s><b class="l2"></b>精通</s><s><b class="l3"></b>过期</s></i>'
  +"</div>";
var LEGEND='<div id="wtop"><button class="wchip" data-act="sq">速查</button>'
  +'<button class="wchip" data-act="bmmap" title="建构图：什么推出了什么、什么是什么的工具、学它是为了什么">脉络</button>'
  +LGD+"</div>";
function buildWall(){
  var t=now(),pm=progressMap(t);
  var html=SUBJECTS.map(function(sub){
    var clusters=sub.chs.map(function(chid){
      var ch=chById[chid],lvs=byChapter[chid]||[];
      var goldN=lvs.filter(function(l){return pm[l.id]==="mastered";}).length;
      var glow=lvs.length?(goldN/lvs.length):0;
      var rows=lvs.map(function(l){
        var st=pm[l.id],cls="row "+stateClass(st);
        if(l.kind==="开章")cls+=" open";
        if(!l.teach)cls+=" skel";
        var hp=levelEw(l).p; /* 真题热度左标（AO）：主考≥9=hot2、≥4=hot1，出题人注意力上墙 */
        if(hp>=9)cls+=" hot2";else if(hp>=4)cls+=" hot1";
        /* 生成图着色（AP，body.gv 下生效）：母关金/挂活银/有边未活暗/无边沉 */
        if(GENMAP.generators[l.id])cls+=" gvg";
        else if(genEdge(l.id))cls+=(genLive(l.id)?" gvl":" gvp");
        var c=S.cases[l.id];
        if(c&&c.seen&&c.due&&c.due<=t&&st!=="dusty")cls+=" due";
        var nd=(l.covers||[]).length;
        var dots=nd?('<i class="dots">'+new Array(nd+1).join("<b></b>")+"</i>"):"";
        return '<button class="'+cls+'" data-k="'+l.id+'"><span class="rt">'+esc(l.title)+"</span>"+dots+"</button>";
      }).join("");
      return '<div class="cluster" style="--glow:'+glow.toFixed(3)+'">'
        +'<div class="chd"><span class="chi">'+chNumeral(chid)+"</span>"+esc(ch?ch.name:chid)+"</div>"
        +'<div class="cells">'+rows+"</div></div>";
    }).join("");
    var tot=0,gold=0;
    sub.chs.forEach(function(ci){(byChapter[ci]||[]).forEach(function(l){tot++;var p=pm[l.id];if(p==="mastered"||p==="dusty")gold++;});});
    return '<section class="band"><div class="bl">'+sub.name+"<em>"+gold+" / "+tot+' 精通</em></div><div class="clusters">'+clusters+"</div></section>";
  }).join("");
  $("#wall").innerHTML=LEGEND+html;
  var gv=gvCount();
  var $g=$("#gvn");
  if($g){ /* AQ 工位二：谜语「独维 R / 已学 L」→ 人话「单独记 R · 已学 L」，悬停一句讲清它算什么 */
    $g.textContent=gv.learned?("单独记 "+gv.roots+" · 已学 "+gv.learned):"推导地图";
    $g.title=gv.learned
      ?("已学的 "+gv.learned+" 关里，还有 "+gv.roots+" 块知识暂时挂不上任何推导源头、只能单独记住；挂上源头的知识忘了也能当场重新推出来，不算数。点击查看推导关系图。")
      :"挂得上推导源头的知识，忘了也能当场重新推出来；挂不上的只能单独记住。点击查看推导关系图。";
  }
  /* 章簇框可滚：每次重渲后把壁纸滚动三件套挂到新生的 .cells（IIFE 定义后才有 __mountScroll；
     首帧 boot 期 IIFE 未及运行，由 IIFE 末尾自行补挂当时已渲的簇框） */
  if(window.__mountScroll)$$(".cells").forEach(window.__mountScroll);
}
/* ————— 生成关系图（AP 提案5）：挂靠判定/根归并/独维数/调度分层 ————— */
function genEdge(lid){return GENMAP.edges[lid]||null;}
function genLive(lid){ /* 挂靠成立=有边且父关已学（画在手里，蒙尘可现场再生） */
  var e=genEdge(lid);if(!e)return false;
  var pc=S.cases[e.g];return !!(pc&&pc.seen);
}
function genFactor(l){return genLive(l.id)?1.5:1;} /* 调度分层：只奖不罚 */
function genRoot(lid){ /* 沿活边走到头；断边即自为根 */
  var cur=lid,hop=0;
  while(hop++<12){
    if(!genLive(cur))return cur;
    cur=genEdge(cur).g;
  }
  return cur;
}
function gvCount(){ /* 独维数=已学非开章关按活边归并后的根数——需要单独维护的东西的个数 */
  var roots={},n=0;
  LEVELS.forEach(function(l){
    if(l.kind==="开章")return;
    var c=S.cases[l.id];if(!(c&&c.seen))return;
    n++;roots[genRoot(l.id)]=1;
  });
  return {learned:n,roots:Object.keys(roots).length};
}
function levelEw(l){ /* 真题权重聚合（covers 原子 ew 求和；AO 权重上墙共用） */
  var ew={p:0,a:0,s:0};
  (l.covers||[]).forEach(function(aid){var w=ATOMS[aid]&&ATOMS[aid].ew;if(w){ew.p+=w.p||0;ew.a+=w.a||0;ew.s+=w.s||0;}});
  return ew;
}
function drawRead(l){
  if(!l){$("#read").innerHTML="";return;}
  var st=progressOf(l.id,now());
  var stn=({unlearned:"未学",learned:"学过",mastered:"精通",dusty:"蒙尘"})[st];
  var cv=(l.covers||[]).join(" ");
  var ew=levelEw(l);
  $("#read").innerHTML="<b>"+esc(l.title)+'</b><span class="k">'+esc(l.kind)+(l.teach?"":" · 铺设中")+"</span>"
    +"<span>"+stn+"</span>"+(cv?'<span class="cv">考点 '+esc(cv)+"</span>":"")
    +(ew.a?'<span class="cv">真题二十年 · 主考'+ew.p+' 触及'+ew.a+' ≈'+Math.round(ew.s)+'分</span>':"")
    +(function(){ /* 生成图注脚（AP）：母关亮画、挂靠亮边 */
      if(GENMAP.generators[l.id])return '<span class="cv">生成器 · '+esc(GENMAP.generators[l.id])+"</span>";
      var e=genEdge(l.id);if(!e)return "";
      var pt=(byId[e.g]||{}).title||e.g;
      return '<span class="cv">可由〈'+esc(pt)+"〉重铸 · "+esc(e.why)+(genLive(l.id)?"":"（母关未学，边未活）")+"</span>";
    })()
    +(l.prereq&&l.prereq.length?'<span class="cv">前置 '+esc(l.prereq.join(" "))+"</span>":"");
}

/* ===================== HUD 与今日安排 ===================== */
/* 初试日期钉死：2027 考研初试 2026-12-19（27 惯例=12 月倒数第二个周六；官方公布如有出入改此行）。
   不再提供用户可改入口；旧档 meta.examDate 一律忽略（字段保留兼容，见 loadState）。 */
var EXAM_DATE="2026-12-19";
function drawCd(){
  var days=Math.ceil((new Date(EXAM_DATE+"T00:00:00").getTime()-now())/DAY);
  var h="距初试 <b>"+(days>=0?days:"—")+"</b> 日";
  $$(".cdout").forEach(function(e){e.innerHTML=h;});   /* 双实例：桌面 #hud 与移动 #mhead 同一读数 */
}
function todayPlan(){
  var t=now();
  var due=LEVELS.filter(function(l){var c=S.cases[l.id];return c&&c.seen&&c.due&&c.due<=t;})
    .sort(function(a,b){return S.cases[a.id].due-S.cases[b.id].due;}).slice(0,10); /* AQ 工位五 v2：≤5 → ≤10/日 */
  var learned={};LEVELS.forEach(function(l){var c=S.cases[l.id];if(c&&c.seen)learned[l.id]=1;});
  var subjIdx={};SUBJECTS.forEach(function(s,i){s.chs.forEach(function(c){subjIdx[c]=i;});});
  function unmet(l){return (l.prereq||[]).filter(function(p){return byId[p]&&byId[p].teach&&!learned[p];}).length;}
  function gsFirst(l){return l.chapter.indexOf("gs")===0?0:1;} /* AQ 工位五：先攻高数（线代/概率仍可自由点，零门锁） */
  var fresh=LEVELS.filter(function(l){return l.teach&&!learned[l.id];});
  /* 软推荐：高数优先，再前置满足者优先，再按科目→章→序（贴合墙的上下阅读序，零门锁） */
  fresh.sort(function(a,b){
    return gsFirst(a)-gsFirst(b)||unmet(a)-unmet(b)||(subjIdx[a.chapter]-subjIdx[b.chapter])||(a.id<b.id?-1:1);
  });
  return {due:due,fresh:fresh.slice(0,NEWPD),left:fresh.length};
}
function drawPlan(){
  var p=todayPlan(),h='<span class="pl">今日安排</span>';
  /* AQ 工位五 · 进度读数：派生自未学关数，渲染时算、不落盘、不加 S 字段。
     紧随牌名而非缀在牌尾——窄屏 #plan 是 nowrap 横滑条，缀尾会被十张牌顶出屏外。 */
  if(p.left)h+='<span class="pgo">未学 '+p.left+' 关 · 日均 '+NEWPD+' 关 ≈ '+Math.ceil(p.left/NEWPD)+' 天学完</span>';
  p.fresh.forEach(function(l){h+='<button class="chip new" data-k="'+l.id+'"><b>新</b>'+esc(l.title)+"</button>";});
  p.due.forEach(function(l){h+='<button class="chip due" data-rk="'+l.id+'"><b>复习</b>'+esc(l.title)+"</button>";});
  if(!p.fresh.length&&!p.due.length)h+='<span style="color:var(--faint2)">墙静候 · 点任一格开始</span>';
  $("#plan").innerHTML=h;
  fitPlan();
  drawMHead();   /* 移动首页头与安排牌同源同步（P16 件一） */
}
/* ————— 移动首页头（P16 件一）—————
   四行：①标题＋距初试 ②chip 排（速查/真题册/触发器/错题档/刷题/单独记/?）③续学卡 ④读数行。
   与桌面 #hud/#plan/#wtop 并存：谁现身由 CSS 判据定（≤820px 或触屏），JS 两处都渲、零分支。
   续学卡＝件三 lastk+c.pos 的正面（同一数据源，两面一体）：有进行中的关就「接着学 · 关名 · 第X拍·拍名」，
   否则「开新 · 今日第一枚未学关」；副行到期复习数（tap 进最早到期那关）。 */
function learnedCount(){var n=0;LEVELS.forEach(function(l){var c=S.cases[l.id];if(c&&c.seen)n++;});return n;}
function beatLabelOf(l,p){var ph=phasesFor(l);return BEATNAME[ph[Math.max(0,Math.min(ph.length-1,p|0))]]||"";}
function drawMHead(){
  var box=$("#mchips");if(!box)return;
  var gv=gvCount();
  box.innerHTML='<button class="mchip" data-act="sq">速查</button>'
    +'<button class="mchip" data-act="bmmap">脉络</button>'
    +'<button class="mchip" data-act="mex">真题册</button>'
    +'<button class="mchip" data-act="mref">触发器</button>'
    +'<button class="mchip" data-act="mwb">错题档</button>'
    +'<a class="mchip" href="game.html">刷题</a>'
    +'<button class="mchip" data-act="mgv">'+(gv.learned?("单独记 "+gv.roots):"推导图")+"</button>"
    +'<button class="mchip mq" data-act="mhelp">?</button>';
  /* 主行数据源＝件三 lastk；lastk 为空时回落到「最近动过且未收墙的关」（c.pos.ts 最大者）。
     ——回落是必要的：lastk 非空时冷启动本就**直接进那一关**，回到墙面必然意味着 lastk 已清，
     若不回落，行三就永远只会显示「开新」，件一「上次进行中的关」的形制落空。
     两者都以「真有进度（p>0 或 a>0）」为门槛，绝不把只是点开看过一眼的关摆上来。 */
  var p=todayPlan(),lk=S.meta.lastk,l=(lk&&byId[lk.k])||null,h="";
  if(!l){
    var bt=0;
    LEVELS.forEach(function(x){
      var c=S.cases[x.id];
      if(!c||!c.pos||c.seen||!x.teach)return;
      if((c.pos.p||0)<=0&&(c.pos.a||0)<=0)return;
      if((c.pos.ts||0)>bt){bt=c.pos.ts||0;l=x;}
    });
  }
  if(l){
    var pos=posClamp(l,(S.cases[l.id]||{}).pos)||{p:0,a:0};
    var bn=beatLabelOf(l,pos.p);
    h+='<button class="g1" data-k="'+l.id+'"><i>接着学</i>'+esc(l.title)
      +(bn?(' · 第 '+(pos.p+1)+" 拍·"+esc(bn)):"")+"</button>";
  }else if(p.fresh.length){
    h+='<button class="g1" data-k="'+p.fresh[0].id+'"><i>开新</i>'+esc(p.fresh[0].title)+"</button>";
  }else{
    h+='<button class="g1"><i>墙静候</i>点任一格开始</button>';
  }
  if(p.due.length)h+='<button class="g2" data-rk="'+p.due[0].id+'">到期复习 <b>'+p.due.length+"</b> · 最早："+esc(p.due[0].title)+"</button>";
  $("#mgo").innerHTML=h;
  $("#mread").textContent="未学 "+p.left+" · 日均 "+NEWPD+" ≈ "+Math.ceil(p.left/NEWPD)+" 天 · 已学 "+learnedCount();
}
function mhelpHtml(){

    +'挂上源头的忘了也能当场重新推出来。点它切换推导关系图。</div>'

/* 安排牌行数随发牌量涨落（新 4 + 到期 10 + 读数，宽屏也可能折两行）：桌面端把墙顶垫到牌底之下，
   牌与墙永不叠压；手机端 #plan/#wall 皆静态流，清掉内联值交回 CSS（两处手机 @media 块不动）。 */
function fitPlan(){
  var w=$("#wall"),p=$("#plan");if(!w||!p)return;
  if(mqStatic()){w.style.paddingTop="";return;}

/* ===================== 返回栈（P15 件四 · 照 vocab 修缮三/四已验架构移植） =====================
   模型：history.state 就是「层」——{v,k,rv,p,l,key,bk,n}，n＝本文档内已压层数（基层 0）。
   三律：①下行＝navGo（同层重入＝原地替换，栈不长个；进册子/房各压一层）
        ②上行一律 history.back()（✕／← 墙／← 返回真题册／手机侧滑同一条路）
        ③popstate 单点渲染目标层，**处理器内零同步 pushState**——iOS 侧滑手势期同文档 pushState
          是 WebKit 卡死点（vocab 追记十四判死）。
   旧伤（本轮连根换掉）：旧 histShim 在 popstate 的 setTimeout(0) 里补签，且 closeRoom 的
        replaceState(pathname) 会把 {ky:1} 签抹掉 → 签消不掉，每开关一次房就在栈里留一枚同 URL
        孤儿条目 → 用户「左滑常进同一个界面」。
   URL 口径不回归：房层带 ?k=<关id>（旧 replaceState 同款），退回墙层由浏览器还原原 URL；
        深链 ?k= 进站时先把基层 URL 抹回 pathname，故「退到墙＝干净地址」与旧行为一致。 */
var NAVOK=!(ST||SEEDED),NAVN=0;   /* selftest/种子档一律不动 history */
function urlOf(p){return (p&&p.v==="room"&&p.k)?(location.pathname+"?k="+encodeURIComponent(p.k)):null;}
function sameLayer(a,b){
  if(!a||!b||a.v!==b.v)return false;
  if(a.v==="room")return a.k===b.k&&!a.rv===!b.rv;
  if(a.v==="page")return a.p===b.p;
  if(a.v==="exam")return (a.l||"")===(b.l||"");
  if(a.v==="drill")return a.l===b.l&&a.key===b.key;
  return true;
}
function navPush(p,url){if(!NAVOK)return;try{p.n=NAVN+1;
  if(url)history.pushState(p,"",url);else history.pushState(p,"");NAVN=p.n;}catch(e){}}
function navRepl(p,url){if(!NAVOK)return;try{p.n=NAVN;
  if(url)history.replaceState(p,"",url);else history.replaceState(p,"");}catch(e){}}
function navGo(p){
  if(!NAVOK)return;
  var c=null;try{c=history.state;}catch(e){}
  if(c&&sameLayer(c,p))navRepl(p,urlOf(p));else navPush(p,urlOf(p));
}
function navBack(fb){
  if(NAVOK&&NAVN>0){history.back();return;}      /* 渲染交给 popstate 单点 */
  var p=fb||{v:"wall"};navRepl(p,urlOf(p));renderLayer(p);
}
function pbackLab(p){var b=$("#pback");if(b)b.textContent="← "+((p&&p.bk)||"墙");}
function renderLayer(p){                          /* 层 → 画面：全壳唯一渲染入口（popstate 单点） */
  p=p||{v:"wall"};
  var v=p.v||"wall";
  if(v!=="room")roomClose();
  if(v==="room"){roomOpen(p.k,p.rv?1:0);return;}  /* roomOpen 自带 closePage */
  if(v==="page"){pbackLab(p);
    if(p.p==="ref")refPage();
    else if(p.p==="wb")wbPage();
    else if(p.p==="map"){MAPV={sel:null,edge:null,hl:p.hl||null,bk:(p.bk||"墙")};MAPHOME=true;mapPage();}
    else sqPage();return;}
  if(v==="exam"){pbackLab(p);examPage(p.l||"all");return;}
  if(v==="drill"){pbackLab(p);drillPage(p.l,p.key);return;}
  closePage();                                    /* wall：房与册子皆收 */
}
window.addEventListener("popstate",function(ev){
  var p=(ev&&ev.state)||{v:"wall",n:0};
