/* ===================== 误触护闸（P15 件五）=====================
   用户实况：加载慢时点屏幕，指头落下时还没渲出选项，渲出后那一击直接把承诺打了、且不许重做。
   双闸：①本视图渲染完成后 GUARD_MS 内的承诺类点击静默忽略；②pointerdown 早于本次渲染完成时刻者
   （＝迟到的合成 click）一并忽略。只拦承诺类，不碰滚动/图讲/推导层步进/返回等无害键；
   第一法不动（护闸只防误触，不设撤销、不设跳过开关）。 */
var GUARD_MS=600,VRT=0,LPD=0;
/* ————— P16 件五 · 宽内容元素级内滚 —————
   量出「自身内容宽于自己」的文本块，就地挂 .xscroll 让它自己横滑（看得全）；
   文档级 overflow-x:hidden 保证页面本身晃不动（无空白可滑）。两层缺一不可。 */
var WIDESEL=".rbody p,.rbody li,.rbody blockquote,.mcq,.chq,.cha,.revq,.dstem,.dans,"
  +".step .sdo,.step .swhy,.opt,.trig .tt,.drvk,.sqi,.sqgh,.figsay p,.pit .pw,.pit .py,"
  +".atom .ac,.atom .req,.track .tk,.ovmap li,.ctab td,.ctab th,.why,.mcp,.dfig";
function fitWide(root){
  try{
    $$(WIDESEL,root&&root.querySelectorAll?root:document).forEach(function(e){
      if(e.scrollWidth>e.clientWidth+1)e.classList.add("xscroll");
      else if(e.classList.contains("xscroll")){e.classList.remove("xscroll");
        if(e.scrollWidth>e.clientWidth+1)e.classList.add("xscroll");}   /* 撤类后复量：本就靠内滚才不宽者留住 */
    });
  }catch(err){}
}
/* ————— P18 件二 · 转屏按内容锚复位（治「横竖屏切一轮后所处位置不同」）—————
   机理：转屏 → 视口宽变 → 行高/折行/公式换行全变 → 内容总高变，而浏览器按**像素** scrollTop 恢复 ⇒ 锚点漂。
   修：宽显著变化（>15%）时按内容锚复位——拿变化**前**记下的「视口顶部最近的定位单元 ＋ 它到滚动容器顶的偏移」，
   变化后把同一单元瞬时滚回同一偏移（零动画，不是 smooth）。保偏移优于裸 scrollIntoView：单元本身很长、
   顶部已滚出视口时，scrollIntoView 会把人弹回该单元开头，保偏移才真是「原地」。
   定位单元集＝P16 c.pos 拍内锚那一族（讲解节/跟算步/推导卡/图讲/微测/题面…），但**取叶子级块**
   （节题、正文段、独立公式、列表项、步、卡…）而非整节 .sec——一节常跨好几屏，拿它作锚时「顶部同偏移」
   落到的行会随折行数变化而错开半屏；叶子级块才真是「±一行」。找不到叶子级时回落 .sec（骨架关等）。
   墙视图同理取叶子级 .row/.chd/.bl，回落章簇 .cluster。
   快照＝滚动停 100ms 后与每次渲染后各记一次（转屏前手早已停），并记下拍摄时的视口宽：
   复位判据是「当前宽 vs **快照宽**」而非「上一次 resize 的宽」——置/撤钳会连锁多次 resize，
   拿上一次宽作基准会被中间态吃掉判据（实测就是这么漏的）。纯内存零落盘：c.pos 照旧只由 posSave 写。 */
var RKSEL="#rin .sech,#rin .rbody>p,#rin .rbody>ul,#rin .rbody>ol,#rin .rbody>blockquote,"
  +"#rin .katex-display,#rin .step,#rin .drv,#rin .fig,#rin .mc,#rin .check,#rin .trig,#rin .ctab,"
  +"#rin .dstem,#rin .dans,#rin .dfig,#rin .revq,#rin .figsay,#rin .opt,#rin .atom,#rin .track,"
  +"#rin .ovmap li,#rin .pit,#rin .judge,#rin .why,#rin .sqgh,#rin .sqi,#rin .qrow,"
  +"#rin .bmblk,#rin .bmsay";   /* P19：脉络块也当定位单元（转屏后落回同一处） */
var RKFB="#rin .sec[data-si],#rin .rbody,#rin .rev";
var WKSEL="#wall .row,#wall .chd,#wall .bl";
var WKFB="#wall .cluster,#wall .band";
var RSNAP=null,ROTDEB=0,ROTFRZ=0;
/* 锚的量＝「视口顶线切在这个块的百分之几」而非「这个块的顶在顶线上方几像素」：
   转屏后同一块的高度必变（折行数变了），按像素保偏移会让长块内的读点跑掉半屏，按**比例**才是原处。
   短块（顶线正好落在块首）ratio≈0，退化成对齐块顶，与直觉一致。 */
function firstBelow(sel,top){
  var els=$$(sel);
  for(var i=0;i<els.length;i++){
    var r=els[i].getBoundingClientRect();
    if(r.height>0&&r.bottom>top+2)return {el:els[i],dy:r.top-top,rat:Math.max(0,Math.min(1,(top-r.top)/r.height))};
  }
  return null;
}
function topUnit(){
  var rm=$("#room"),host=null,sel=WKSEL,fb=WKFB,top=0;
  if(R&&rm&&!rm.classList.contains("hide")){host=rm;sel=RKSEL;fb=RKFB;top=rm.getBoundingClientRect().top;}
  var u=firstBelow(sel,top)||firstBelow(fb,top);
  if(!u)return null;
  u.host=host;u.iw=window.innerWidth||0;
  return u;
}
function rotSnap(){try{RSNAP=topUnit();}catch(e){RSNAP=null;}}
/* 冻结窗（ROTFRZ）：转屏本身会让浏览器改 scrollTop 并派发 scroll，那一路 scroll 若照常刷新快照，
   「变化前的锚」当场就被「已经漂掉的位置」顶掉，复位判据随之失效（实测就是这么漏的第二回）。
   故 resize 一起就冻住快照，直到复位落定再主动重取一次作为新方向的基准。 */
function rotBump(){
  if(ROTFRZ&&now()<ROTFRZ)return;
  clearTimeout(ROTDEB);ROTDEB=setTimeout(function(){if(ROTFRZ&&now()<ROTFRZ)return;rotSnap();},100);
}
function rotRestore(){
  var s=RSNAP;if(!s||!s.el||!s.el.isConnected)return;
  try{
    var r=s.el.getBoundingClientRect(),off=(s.rat||0)*r.height;   /* 新高度上的同比例读点 */
    if(s.host){var rr=s.host.getBoundingClientRect();
      s.host.scrollTop=Math.max(0,s.host.scrollTop+(r.top-rr.top)+off);}
    else{var de=document.documentElement;de.scrollTop=Math.max(0,de.scrollTop+r.top+off);}
  }catch(e){}
}
function rotWidthChanged(){   /* 与**快照拍摄时**的宽相比，超 15% 才算「转屏级」变化 */
  var s=RSNAP,nw=window.innerWidth||0;
  return !!(s&&s.iw&&nw&&Math.abs(nw-s.iw)/s.iw>0.15);
}
function markView(){VRT=now();fitWide();rotBump();}
function misTap(){
  var t=now();
  if(t-VRT<GUARD_MS)return true;      /* 刚渲出来就被点：手是冲着上一屏去的 */
  if(LPD&&LPD<VRT)return true;        /* 指头落下时本屏还没渲完：迟到的合成 click */
  return false;
}
var CMTACT={mc:1,rmc:1,strategy:1,step:1,trap:1,exopt:1,rex:1,seal:1,
            jok:1,jno:1,exok:1,exno:1,rexok:1,rexno:1,attr:1};

/* ===================== 关卡页（六拍状态机；第一法=代码层强制） ===================== */
var R=null; /* {level,kind,phases,pi,committed,revealed,mode,trapOrder} */
var BEATNAME={skel:"未开放",overview:"开卷",open:"开场",teach:"讲解",walk:"跟算",trap:"对错题",clear:"讲透"};
function phasesFor(l){
  if(!l.teach)return ["skel"];
  if(l.kind==="开章")return ["overview"];
  if(l.kind==="概念")return ["teach"];
  if(l.mother&&l.mother.steps&&l.mother.steps.length){
    var p=["open","teach","walk"];
    if(l.trap)p.push("trap");
    p.push("clear");
    return p;
  }
  return ["teach"];
}
function requireCommit(key){if(!R||R.committed[key]===undefined)throw new Error("REVEAL_WITHOUT_COMMIT");}
function revealStep(i){
  var st=R.level.mother.steps[i];
  if(st.commit)requireCommit("step"+i);   /* 有押注的关键步：无承诺不揭示（第一法） */
  R.revealed["step"+i]=true;
}
function mcKeys(l){ /* 节内测题全集：q=节后微测；q2=拆墙实验（删条件找反例，AM 提案2） */
  var out=[];((l.teach&&l.teach.detail)||[]).forEach(function(d,i){
    if(d.q)out.push({k:String(i),sec:i,q:d.q});
    if(d.q2)out.push({k:i+"b",sec:i,q:d.q2});
  });return out;
}
function mcQof(l,k){var d=((l.teach&&l.teach.detail)||[])[parseInt(k,10)];if(!d)return null;return /b$/.test(k)?d.q2:d.q;}
function mcAnswered(l,k){
  if(R&&R.committed["mc"+k]!==undefined)return true;
  var c=S.cases[l.id];return !!(c&&c.mc&&c.mc[k]);
}
function teachDone(l){
  var ok=mcKeys(l).every(function(e){return mcAnswered(l,e.k);});
  if(l.teach&&l.teach.check&&!(R&&R.revealed.check))ok=false; /* 收尾自测未亮不放行 */
  return ok;
}
function canAdvance(){
  var ph=R.phases[R.pi];
  if(ph==="open")return R.committed.strategy!==undefined; /* 开场先选策略后方可推进 */
  if(ph==="trap")return R.committed.trap!==undefined;     /* 对错题先判后方可推进 */
  if(ph==="teach")return teachDone(R.level);              /* 讲解拍：节后微测全答+收尾自测已亮 */
  if(ph==="walk"){var st=(R.level.mother&&R.level.mother.steps)||[];  /* 跟算拍：逐步走完才放行 */
    for(var i=0;i<st.length;i++){if(!R.revealed["step"+i])return false;}return true;}
  return true;
}
function canSeal(){
  if(!R)return false;
  if(R.kind==="开章")return !!R.readEnd;       /* 开卷：读到底才收 */
  if(R.kind==="概念")return teachDone(R.level); /* 概念：微测+收尾自测齐 */
  return true;                                  /* 方法：open/teach/walk/trap 各闸在前 */
}
/* ===================== 精确续学（P16 件三）=====================
   目标（用户亲令）：点进应用直接接上上次学到的位置——**对应章节的对应部分**。
   两级指针：①应用级 S.meta.lastk={k,ts}（上次在哪一关，开房写、关房清）
            ②关内 case.pos={p,a,ts}（p=拍序、a=拍内锚：讲解拍=滚视到的节序，跟算拍=当前步序，其余 0）。
   **第一法铁线**：恢复只恢复「拍与滚动锚」——揭示态从不落盘，故跨会话回来时未 commit 的步一律停在
   承诺态，绝不预揭绝不跳过；已过拍可自由回跳，向前照旧守 canAdvance。
   豁免：selftest/SEEDED/MEMONLY 一律不写（与云档同步适配器 blocked() 同口径）；?reset 在 boot 即跳转。 */
var POSDEB=0;
function noWrite(){try{return !!(ST||SEEDED||window.__MEMONLY);}catch(e){return true;}}
function posClamp(l,pos){ /* 越界自愈：p 超拍数钳到末拍、负值归零；坏件返 null */
  if(!pos||typeof pos!=="object"||Array.isArray(pos)||typeof pos.p!=="number")return null;
  var ph=phasesFor(l),p=pos.p|0,a=(typeof pos.a==="number")?(pos.a|0):0;
  if(!(p>=0))p=0;
  if(p>ph.length-1)p=ph.length-1;
  if(!(a>=0))a=0;
  return {p:p,a:a,ts:(typeof pos.ts==="number")?pos.ts:0};
}
function visibleSecIdx(){ /* 房内当前滚到第几个讲解节（.sec[data-si]，取视口上四分位线以上的最后一节） */
  var rm=$("#room");if(!rm)return 0;
  var secs=$$("#rin .sec[data-si]"),line=rm.scrollTop+rm.clientHeight*0.3,best=0;
  for(var i=0;i<secs.length;i++){if(secs[i].offsetTop<=line)best=+secs[i].getAttribute("data-si");}
  return best>=0?best:0;
}
function curAnchor(){
  if(!R)return 0;
  var ph=R.phases[R.pi];
  if(ph==="teach"||ph==="overview")return visibleSecIdx();
  if(ph==="walk"){
    var st=(R.level.mother&&R.level.mother.steps)||[],i=firstUnrevealed(st);
    return i<0?Math.max(0,st.length-1):i;
  }
  return 0;
}
function posSave(){ /* 拍切换即写＋锚变防抖 3s＋离页即写；同值不写盘（省云档抖动） */
  if(!R||noWrite()||R.mode==="review")return;
  var id=R.level.id,np={p:R.pi|0,a:curAnchor()|0,ts:now()};
  if(!S.cases[id]&&!np.p&&!np.a)return;   /* 未学关停在第一拍开头＝无信息量，不为它新建 case */
  var c=ensureCase(id),op=c.pos;
  if(op&&op.p===np.p&&op.a===np.a)return;
  c.pos=np;save();
}
function posBump(){clearTimeout(POSDEB);POSDEB=setTimeout(function(){try{posSave();}catch(e){}},3000);}
function restoreAnchor(a){ /* 锚复位：讲解拍滚到第 a 节，跟算拍滚到第 a 步（只滚不揭） */
  var rm=$("#room");if(!rm||!R||!a)return;
  var ph=R.phases[R.pi],el=null;
  if(ph==="walk")el=$$("#rin .step")[a]||null;
  else el=$("#rin .sec[data-si='"+a+"']");
  if(!el)return;
  /* 用相对矩形而非 offsetTop：与 offsetParent 无关，房内任何定位上下文都算得准 */
  var r=el.getBoundingClientRect(),rr=rm.getBoundingClientRect();
  rm.scrollTop=Math.max(0,rm.scrollTop+(r.top-rr.top)-8);
  ANCHLAST=rm.scrollTop;      /* 记下我方设定值：与之不符即用户自己滚了，补滚立即让位 */
}
var ANCHLAST=-1;
/* 首渲时 KaTeX 字体尚未就绪、图讲 SVG 高度未落定 ⇒ 那一刻量到的位置偏上（实测差几百到一千多 px）。
   故在同房同拍守卫下补滚数次（rAF／140ms／420ms／字体 ready），超 2.5s 一律不再打扰用户。 */
var ANCHN=0;   /* 补滚次数（调试可读：__M.anchN），无用户可见副作用 */
function anchorSettle(a){
  if(!R||!a)return;
  var lid=R.level.id,pi=R.pi,t0=now(),ro=null,rm=$("#room");
  var stop=function(){if(ro){try{ro.disconnect();}catch(e){}ro=null;}};
  var run=function(){
    if(!R||R.level.id!==lid||R.pi!==pi||now()-t0>8000){stop();return;}
    if(ANCHLAST>=0&&rm){
      /* 位置与我方设定不符才算「用户自己滚了」——但内容变矮时浏览器会把 scrollTop 钳回来，
         那是被动钳制不是用户手势，此时应继续对齐（否则锚就永远停在钳后的位置）。 */
      var mx=rm.scrollHeight-rm.clientHeight;
      if(!(ANCHLAST>mx+2)&&Math.abs(rm.scrollTop-ANCHLAST)>2){stop();return;}
    }
    ANCHN++;restoreAnchor(a);
  };
  ANCHLAST=-1;run();
  try{requestAnimationFrame(run);}catch(e){}
  setTimeout(run,140);setTimeout(run,420);setTimeout(run,900);
  /* 真正的判据是「内容高度还在变」——字体到位、图讲 SVG 布局落定都会改高度；ResizeObserver 全覆盖。
     窗口 8s 但「用户一动即让位」，故既接得住慢加载，也绝不跟用户抢滚动条。 */
  try{if(window.ResizeObserver){ro=new ResizeObserver(run);ro.observe($("#rin"));setTimeout(stop,8200);}}catch(e){}
  try{if(document.fonts&&document.fonts.ready&&document.fonts.ready.then)document.fonts.ready.then(run);}catch(e){}
}
function lastkSet(id){ /* 开房写、关房清；坏关 id 不写 */
  if(noWrite())return;
  var nv=(id&&byId[id])?{k:id,ts:now()}:null,ov=S.meta.lastk||null;
  if(!nv&&!ov)return;
  if(nv&&ov&&ov.k===nv.k)return;   /* 同关重入不重复写盘 */
  S.meta.lastk=nv;save();
}
/* 冷启动路由（纯函数，selftest 可喂假 q/meta）：深链参数**绝对优先**，其次 lastk，再次墙。
   ?fz 是调试字号参不算深链（它不指定去处）；?at 只与 ?k 同用。 */
var DEEPKEYS=["k","sq","exam","gv","map","selftest","reset","seed"];
function bootTarget(q,meta){
  var has=function(x){return q?(q.has?q.has(x):!!q[x]):false;};
  for(var i=0;i<DEEPKEYS.length;i++){if(has(DEEPKEYS[i]))return {v:"deep"};}
  var lk=meta&&meta.lastk;

  return {v:"wall"};
}
function sealedK(id){var c=S.cases[id];return !!(c&&c.seen);} /* 收过墙＝回看态候选 */

/* ————— 纯读判据（P16 件六）—————
   「≤820px 或 (pointer:coarse) 触屏」任一命中即纯读形态（CSS 同判据）；
   iPhone 横屏 844~932px 此前掉出旧断点走桌面布局，正是「横竖屏不一样」的病根。 */
function mq(s){try{return !!(window.matchMedia&&window.matchMedia(s).matches);}catch(e){return false;}}
function mqRead(){return mq("(max-width:820px)")||mq("(pointer:coarse)")||window.innerWidth<=820;}
function mqStatic(){return window.innerWidth<=900;}  /* 静态流墙判据（与 @media(max-width:900px) 同源；iPad 走桌面墙） */
/* tap 切换纯净态：房内 tap 非交互空白 → 藏尽 chrome 只剩内容，再 tap 恢复细行。
   排除表＝一切按钮/选项/承诺区/微测/目录 chip/图讲块/推导卡/导航/内滚容器；
   判 tap＝位移<10px 且期间未滚动。与误触护闸并存（护闸管承诺钮的 click，这里管空白区的 pointerup）。 */
var CLNSEL="button,a,input,textarea,select,[data-act],[data-k],[data-rk],.opt,.fig,.drv,.commit,"

function cleanHit(n){return !!(n&&n.closest&&!n.closest(CLNSEL));}
function cleanSet(on){

/* ————— P18 件一 · 文档滚动锁（黑块根治；机理详见同名 CSS 块的长注）—————
   房/册子＝fixed 全屏层，它们在场时根文档一格都不该能滚。幂等（重复上锁不覆写记忆位），
   解锁时把墙复原到进房前那一处（rAF 补一次：墙三件刚从 display:none 回来，首帧布局可能还没落定）。 */
var DOCY=0;
function docLock(on){
  var de=document.documentElement;if(!de)return;
  var cur=de.classList.contains("lockdoc");
  if(on){
    if(cur)return;
    DOCY=de.scrollTop||window.pageYOffset||0;
    de.classList.add("lockdoc");
    if(de.scrollTop)de.scrollTop=0;   /* 文档回顶＝fixed 全屏层与视觉视口严丝合缝，iOS 惯性期不露底 */
  }else{
    if(!cur)return;
    de.classList.remove("lockdoc");
    var y=DOCY;DOCY=0;
    if(y){var put=function(){try{if(Math.abs(de.scrollTop-y)>1)de.scrollTop=y;}catch(e){}};
          put();try{requestAnimationFrame(put);}catch(e){}}
  }
}

/* ————— 房的开合（DOM 级，不动 history；导航一律走下方层栈）————— */
function reviewable(l){ /* 复习件在不在：方法关有 fresh、概念关有微测；皆无者复现即重读 */
  return !!(l&&l.teach&&(((l.fresh||[]).length)||mcKeys(l).length));
}
function roomOpen(id,rv){

/* ===================== 图讲（P14 · detail[].fig）=====================
   一节讲解以一张图作引子：图在上、当前步 say 在下、步进点一排；点图右半/「下一步」前进，左半后退，
   点可直跳，键盘 ←→ 同路，到末步停（不循环）。契约见 tools/math/_p14/SPEC_P14_图讲.md。
   · 坐标一律数学坐标（y 向上），渲染期翻转到 SVG（Y=-y）——文字不入翻转组，故永不倒置。
   · 元素九型 axes/fn/seg/pt/arc/lb/poly/vline/hline；色五枚 s0/s1/txt/gold/dim 映射既有 CSS 变量，
     缺省 s1；金只归当步 hl。steps[].on 声明式全权（不累积），hl 在 on 之上强制金。
   · 线宽经 vector-effect 钉 px；字号/点径/文字偏移由 figMount 按实测缩放（getScreenCTM）钉成 px，
     故大图小图字一样大；测不到缩放时回落解析估值（vb 比例），永不空白。
   · 步进状态纯内存 FIG{}（投影律：不落盘、不入存档、不进云档）；不设承诺闸（第一法不涉讲解阅读）。

function fnum(v){var n=Math.round((+v||0)*1e4)/1e4;return String(n);}
function figKey(lid,i){return lid+"#"+i;}
function figAt(lid,i){var l=byId[lid],d=l&&l.teach&&l.teach.detail&&l.teach.detail[i];return (d&&d.fig)||null;}
function figFn(f){ /* JS 表达式串 → 一元函数（唯一自由变量 x）；编译失败返 null，缓存避免重编 */
  var k="k:"+f;

function figText(s,ax,ay,dx,dy,anchor,col,FS){

function figPts(list){ /* 数学点列 → SVG points 串（y 翻转） */

/* ===================== 推导层（P15 · detail[].deriv）=====================

    var cls="opt";

    h+='<button class="'+cls+'" data-act="mc" data-k="'+k+'" data-o="'+oi+'" '+(done?"disabled":"")+">"+inlineMd(opt)+"</button>";
  });
  if(done&&q.why)h+='<div class="why">'+inlineMd(q.why)+"</div>";
  if(done&&past&&R&&R.committed["mc"+k]===undefined)h+='<div class="mcp">'+(past.ok?"上次已答对":"上次答错 · 这一节值得重读")+"</div>";
  return h+"</div>";
}
function commitMc(k,oi){
  if(!R)return;
  var l=R.level,q=mcQof(l,k);
  if(!q||R.committed["mc"+k]!==undefined)return;
  var c=ensureCase(l.id);
  if(c.mc[k])return; /* 跨会话已答：不重判（复习态走 rmc 另计） */
  R.committed["mc"+k]=oi;
  var ok=oi===q.ans;
  if(!R.browse)c.mc[k]={ok:ok,p:oi,t:now()};   /* 回看态只在内存里判给自己看，不改档（P16 件三 4） */
  rec(l.id,q.t==="拆墙"?"拆墙":"微测",ok,0);
  var el=$("#mc"+k);
  if(el){var tmp=document.createElement("div");tmp.innerHTML=renderMc(l,k,q);
    el.replaceWith(tmp.firstChild);fitWide($("#mc"+k));} /* 原地换装不重渲，滚动位置不动 */
  renderNav();
}
function renderCheck(ck){
  var rev=R&&R.revealed.check;
  return '<div class="check"><div class="chl">收尾自测 · '+esc(ck.type||"判断")+"（答错无罚，先想再看）</div>"
    +'<div class="chq">'+inlineMd(ck.q||"")+"</div>"
    +(rev?'<div class="cha">'+inlineMd(ck.ans||"")+"</div>"
        :'<div class="creveal" data-act="check">▸ 想好了 · 亮参考对答</div>'
        +'<div class="cha hide">'+inlineMd(ck.ans||"")+"</div>")
    +"</div>";
}
function renderOpen(l){

  var cm=m.commit;

    h+='<div class="commit"><div class="clab">先选策略 · 轻押注（答错无罚，逼你先动脑）</div>';

      var cls="opt",done=R.committed.strategy!==undefined;

    });
    h+="</div>";
    if(R.committed.strategy!==undefined&&cm.why)h+='<div class="why">'+inlineMd(cm.why)+"</div>";
  }

}
function renderWalk(l){
  var m=l.mother||{},steps=m.steps||[];
  var h='<div class="sech">跟算 · 分步带做</div><div class="rbody" style="color:var(--dim)"><p>'+rt(m.stem||"")+"</p></div>";
  steps.forEach(function(st,i){
    var revealed=R.revealed["step"+i],hasCommit=!!st.commit,committed=R.committed["step"+i]!==undefined;
    var cls="step";
    if(revealed||committed)cls+=" done";else if(i===firstUnrevealed(steps))cls+=" on";
    var sh='<div class="'+cls+'"><div class="sn">'+(i+1)+"</div>";
    if(hasCommit&&!committed&&!revealed){
      sh+='<div class="commit"><div class="clab">关键步 · 先选后揭</div>';
      st.commit.options.forEach(function(opt,oi){
        sh+='<button class="opt" data-act="step" data-i="'+i+'" data-o="'+oi+'">'+inlineMd(opt)+"</button>";
      });
      sh+="</div>";
    }else if(!revealed&&!committed){
      sh+='<div class="locked" data-act="stepshow" data-i="'+i+'">▸ 展开这一步</div>';
    }else{
      sh+='<div class="sdo">'+inlineMd(st.do||"")+"</div>";
      if(st.katex)sh+='<div class="skx">'+renderTex(st.katex,true)+"</div>";
      if(st.why)sh+='<div class="swhy">'+inlineMd(st.why)+"</div>";
      if(hasCommit&&committed&&st.commit.why){
        var picked=R.committed["step"+i],right=st.commit.ans;
        sh+='<div class="why">'+(picked===right?"":"（你先前选了别项，看这里）")+inlineMd(st.commit.why)+"</div>";
      }
    }
    h+=sh+"</div>";
  });
  return h;
}
function firstUnrevealed(steps){
  for(var i=0;i<steps.length;i++){if(!R.revealed["step"+i]&&R.committed["step"+i]===undefined)return i;}
  return -1;
}
function renderTrap(l){

      +'<button class="'+cls+'" data-act="trap" data-i="'+idx+'" data-w="'+which+'" '+(committed?"disabled":"")
      +' style="width:100%">'+rt(text||"")+"</button></div>";

}
function renderClear(l){
  var m=l.mother||{},h='<div class="sech">讲透 · 判词</div>';
  if(m.trigger)h+='<div class="trig"><div class="tl">触发器 · 见什么特征 → 想什么方法</div><div class="tt">'+inlineMd(m.trigger)+"</div></div>";
  if(l.trap&&l.trap.real)h+='<div class="sec"><div class="plabel">完整解</div><div class="rbody">'+rt(l.trap.real)+"</div></div>";
  if(l.teach&&l.teach.pitfall&&l.teach.pitfall.length){
    h+='<div class="sec"><div class="plabel">错因回望</div>';
    l.teach.pitfall.forEach(function(p){h+='<div style="margin:.4rem 0;color:var(--dim);font-size:.84rem;line-height:1.7;font-family:var(--cjk)">'+inlineMd(p.why||"")+"</div>";});
    h+="</div>";
  }
  h+='<div class="rbody" style="color:var(--dim);margin-top:1rem"><p>这一格的功夫已交给你。点<strong>收进墙</strong>，'+INT[0]+'日后的复习会送来一道生题——算对它，格子转金。</p></div>';
  return h;
}
function seal(){
  if(!canSeal())return;
  if(R.browse)return;   /* 回看态双保险：UI 已不给键，代码层再封一道（间隔梯不容误清） */
  var l=R.level,c=ensureCase(l.id),id=l.id;
  c.seen=(c.seen||0)+1;
  c.hits.push({t:now(),ok:true,ms:0,kind:"跟算",fresh:false});
  c.g=0;c.due=now()+INT[0]*DAY;
  save();closeRoom();buildWall();drawPlan();
  var cell=$('.row[data-k="'+id+'"]');
  if(cell){cell.classList.add("justlit");setTimeout(function(){cell.classList.remove("justlit");},900);}
  toast("已收进墙 · "+INT[0]+" 日后复习");
}
/* 记账口（唯一写 hits 处）。P16 件三 4：回看态零记账——重看已收墙的关不该往 hits 里灌流水、
   更不该经由任何路径碰 due/g；复习态 browse 恒 false，故复习记账分毫不受影响。 */
function rec(id,kind,ok,ms){
  if(R&&R.browse)return;
  var c=ensureCase(id);c.hits.push({t:now(),ok:!!ok,ms:ms||0,kind:kind,fresh:false});save();}

/* ===================== 复习态（压缩拍：触发器重认 + fresh 生题自判） ===================== */
/* ————— 复习尾题（AQ 工位四）：到期复习末尾恰一道该关真题 —————
   选题律：优先 case.dr 未做过者（按 drills 挂载序）→ 全做过取「最早做过」那道；无 drills 的关不产此段（静默）。
   交互沿真题册（选择题先选后揭 / 解答题亮答案自评），战绩照记 case.dr、判错入错题档。
   宪法四不破：真题对错不改 due、不参与转金（晋阶只认生题；rec 记 kind="真题"，progressOf/reviewKind 只认生题）。 */
function pickReviewDrill(l){
  var ds=drillsOf(l);if(!ds.length)return null;
  var c=S.cases[l.id]||{},dr=c.dr||{},i,k;
  for(i=0;i<ds.length;i++){k=ds[i].y+"-"+ds[i].qno;if(!dr[k])return k;}
  var best=ds[0].y+"-"+ds[0].qno,bt=Infinity;
  ds.forEach(function(d){var kk=d.y+"-"+d.qno,e=dr[kk],tt=(e&&e.t)||0;if(tt<bt){bt=tt;best=kk;}});
  return best;
}
function revExNote(dn){ /* 战绩注：本轮刚记 vs 此前做过（真题册一击定案口径：做过不重判） */
  if(R&&R.exJudged)return dn.ok?"已记 · 判对":"已记 · 判错 · 已入错题档";
  return dn.ok?"此前做过 · 自评对":"此前做过 · 自评错";
}
function reviewDrillHtml(l){
  var key=R&&R.exKey;if(!key)return "";
  var d=findDrill(l.id,key);if(!d)return "";
  var dn=drillDone(l.id,key);
  var h='<div class="sec"><div class="plabel gold">真题一道 · '+d.y+" 年第 "+d.qno+" 题（"+esc(d.sec)+" · "+d.score+" 分"+(d.taylor?" · 泰勒主解法":"")+"）</div>";
  h+='<div class="rbody" style="color:var(--dim)"><p>这一道只记战绩，不改复习间隔。</p></div>';
  h+='<div class="dstem">'+rt(d.stem)+"</div>";
  if(d.fig)h+='<div class="dfig">图 · '+inlineMd(d.fig)+"</div>";
  if(d.options&&d.options.length){ /* 选择题：先选后揭，一击定案 */
    var done=!!dn,right="ABCD".indexOf(String(d.ans).trim().charAt(0));
    d.options.forEach(function(opt,oi){
      var cls="opt";
      if(done){if(oi===right)cls+=" right";else if(dn.p===oi)cls+=" wrong";}
      h+='<button class="'+cls+'" data-act="rex" data-o="'+oi+'" '+(done?"disabled":"")+">"+inlineMd(opt)+"</button>";
    });
    if(done)h+='<div class="why">答案 '+esc(String(d.ans))+"　·　"+revExNote(dn)+"</div>";
  }else{ /* 填空/解答：亮答案自评 */
    if(!R.exShown&&!dn){
      h+='<div class="rbody" style="color:var(--dim)"><p>先在纸上做完，再亮答案自评。</p></div>'
        +'<div class="judge"><button class="jb ok" data-act="rexshow">▸ 亮答案</button></div>';
    }else{
      h+='<div class="dans">'+rt(String(d.ans))+"</div>";
      if(dn)h+='<div class="why">'+revExNote(dn)+"</div>";
      else h+='<div class="judge"><button class="jb ok" data-act="rexok">我做对了</button><button class="jb no" data-act="rexno">我做错了</button></div>';
    }
  }
  return h+"</div>";
}
function drRecord(lid,key,ok,pick){ /* 真题战绩落档（真题册与复习尾题同一口径：一击定案，做过不重判） */
  var c=ensureCase(lid);
  if(c.dr[key])return;
  c.dr[key]={ok:!!ok,p:(pick===undefined?null:pick),t:now()};
  rec(lid,"真题",!!ok,0);
  if(!ok)(WB[lid]=WB[lid]||[]).push({t:now(),which:"真题"});
  save();
}
function revExRerender(){ /* 复习页原地重渲（保滚动位：尾题在页底，答一下不跳顶） */
  if(!R)return;
  var rm=$("#room"),sc=rm?rm.scrollTop:0;
  if(R.phases[0]==="rmc")renderReviewMc();else renderReview();
  if(rm)rm.scrollTop=sc;
}
function commitRevEx(oi){
  if(!R||!R.exKey)return;
  var l=R.level,d=findDrill(l.id,R.exKey);if(!d)return;
  if(drillDone(l.id,R.exKey))return;
  var right="ABCD".indexOf(String(d.ans).trim().charAt(0));
  drRecord(l.id,R.exKey,oi===right,oi);
  R.exJudged=1;revExRerender();
}
function revExJudge(ok){
  if(!R||!R.exKey)return;
  if(drillDone(R.level.id,R.exKey))return;
  drRecord(R.level.id,R.exKey,ok);
  R.exJudged=1;R.exShown=true;revExRerender();
}
function nextTouchNote(c){ /* AQ 工位五 v2：末触判对即收口，读数如实说，不指涉缺席 */
  return (c&&c.due)?("下次复习间隔 "+intAt(c.g)+" 天。"):"2/7/20 三触已走完 · 此关不再排期。";
}
function rmcOrder(l){
  var c=S.cases[l.id]||{},mc=c.mc||{},es=mcKeys(l);
  var wrong=es.filter(function(e){return mc[e.k]&&!mc[e.k].ok;});
  return wrong.concat(es.filter(function(e){return wrong.indexOf(e)<0;}));
}
function renderAttrRow(){ /* 错题三栏归因（AM 提案4）：「粗心」不在选项里 */
  var at=R.committed.attr;
  var h='<div class="mc"><div class="mcl">归因 · 这次错算哪种（一击即过；「粗心」不在选项里）</div>';
  [["噪声","抄错看错——流程毛病，给自己配一个检查动作"],
   ["故障","某块知识没焊牢——回炉对应那一关"],
   ["反例","我以为的规则不对——收进反例集，最值钱的一种"]].forEach(function(p,i){
    var cls="opt"+(at===i?" right":"");
    h+='<button class="'+cls+'" data-act="attr" data-i="'+i+'" '+(at!==undefined?"disabled":"")+">"+p[0]+" · "+p[1]+"</button>";
  });
  return h+"</div>";
}
function attrPending(){return !!(R&&R.mode==="review"&&(R.committed.judge===0||R.committed.rmcDone===0)&&R.committed.attr===undefined);}
function commitAttr(i){
  if(!R||R.committed.attr!==undefined)return;
  R.committed.attr=i;
  var l=R.level,arr=WB[l.id];
  if(arr&&arr.length)arr[arr.length-1].attr=["噪声","故障","反例"][i];
  rec(l.id,"归因",true,0);save();
  if(R.phases[0]==="rmc")renderReviewMc();else renderReview();
}
function renderReviewMc(){
  var l=R.level,det=l.teach.detail,es=rmcOrder(l);
  drawTop(topBar("复习",l.title,'<span id="beats" class="rtx"><span class="on">微测重问 · 上次错的在前</span></span>',0));
  var h='<div class="rev">';
  es.forEach(function(e,seq){
    var q=e.q,picked=R.committed["rmc"+e.k],done=picked!==undefined;
    h+='<div class="mc"><div class="mcl">第 '+(seq+1)+' 问'+(q.t==="拆墙"?" · 拆墙实验":"")+' · 出自「'+esc(det[e.sec].h||"")+'」</div>';
    h+='<div class="mcq">'+inlineMd(q.q||"")+"</div>";
    (q.options||[]).forEach(function(opt,oi){
      var cls="opt";
      if(done){if(oi===q.ans)cls+=" right";else if(oi===picked)cls+=" wrong";}
      h+='<button class="'+cls+'" data-act="rmc" data-k="'+e.k+'" data-o="'+oi+'" '+(done?"disabled":"")+">"+inlineMd(opt)+"</button>";
    });
    if(done&&q.why)h+='<div class="why">'+inlineMd(q.why)+"</div>";
    h+="</div>";
  });
  if(R.committed.rmcDone!==undefined){
    var c=S.cases[l.id]||{g:0};
    h+='<div class="why">'+(R.committed.rmcDone?"全对 · 间隔上调。":"有错 · 归零重修，错节已标。")
      +" "+nextTouchNote(c)+"</div>";
    if(R.committed.rmcDone===0)h+=renderAttrRow();
    h+=reviewDrillHtml(l); /* AQ 工位四：复习末尾恰一道真题 */
  }
  h+="</div>";
  $("#rin").innerHTML=h;
  renderNav();markView();
}
function commitRmc(k,oi){
  if(!R||R.committed["rmc"+k]!==undefined)return;
  var l=R.level,q=mcQof(l,k);if(!q)return;
  var ok=oi===q.ans;
  R.committed["rmc"+k]=oi;
  var c=ensureCase(l.id);
  c.mc[k]={ok:ok,p:oi,t:now()}; /* 复习战绩覆盖上次，错节继续置前 */
  rec(l.id,q.t==="拆墙"?"拆墙复习":"微测复习",ok,0);
  var es=mcKeys(l);
  if(es.every(function(e){return R.committed["rmc"+e.k]!==undefined;})){
    var allOk=es.every(function(e){return R.committed["rmc"+e.k]===e.q.ans;});
    var last=isLastRung(c.g);
    c.seen=(c.seen||0)+1;
    if(allOk){c.g=Math.min((c.g||0)+1,INT.length-1);}
    else{c.g=0;(WB[l.id]=WB[l.id]||[]).push({t:now(),which:"微测"});}
    /* AP 调度分层（挂活生成器 ×1.5）；AQ 工位五 v2：末触判对 → due=0 收口，不再排期亦永不蒙尘 */
    c.due=(allOk&&last)?0:now()+Math.round(intAt(c.g)*DAY*(allOk?genFactor(l):1));
    R.committed.rmcDone=allOk?1:0;
    R.exKey=pickReviewDrill(l); /* AQ 工位四：判词落定即选定尾题（一次选定，重渲不换题） */
    save();buildWall();drawPlan();
  }
  renderReviewMc(); /* 重渲不重置滚动：多问页答一题不跳顶 */
}
function renderReview(){
  var l=R.level,c=S.cases[l.id]||{hits:[]};
  var rk=reviewKind(c,l),fr=(l.fresh&&l.fresh[rk.idx])||l.fresh[0]||{};
  drawTop(topBar("复习",l.title,
    '<span id="beats" class="rtx"><span class="on">'+(rk.kind==="生题"?"生题·扣留题":"桥件·续间隔")+"</span></span>",0));
  var h='<div class="rev">';
  if(l.mother&&l.mother.trigger)h+='<div class="trig"><div class="tl">触发器 · 先重认</div><div class="tt">'+inlineMd(l.mother.trigger)+"</div></div>";
  h+='<div class="plabel gold" style="margin:1.1rem 0 .4rem">'
    +(rk.kind==="生题"?"生题 · build 期扣留（单次消费）":"桥件 · 已见变式（只续间隔，永不再晋阶）")+"</div>";
  h+='<div class="revq">'+rt(fr.stem||"")+"</div>";
  if(!R.revealed.ans){
    h+='<div class="rbody" style="color:var(--dim)"><p>先在纸上盲算，再亮答案自评。</p></div>';
    h+='<div class="judge"><button class="jb ok" data-act="reveal">▸ 亮答案</button></div>';
  }else{
    h+='<div class="sec"><div class="plabel">参考解</div><div class="rbody">'+rt(fr.ans||"")+"</div>";
    if(fr.judge)h+='<div class="why">'+inlineMd(fr.judge)+"</div>";
    h+="</div>";
    if(R.committed.judge===undefined){
      h+='<div class="judge"><button class="jb ok" data-act="jok">我算对了</button><button class="jb no" data-act="jno">我算错了</button></div>';
    }else{
      var ok=R.committed.judge,cc=S.cases[l.id]||{g:0};
      h+='<div class="why">'+(ok?"转精通 · 格已点金。":"降回半明 · 已入错题档加练。")
        +" "+nextTouchNote(cc)+"</div>";
      if(ok===0)h+=renderAttrRow();
      h+=reviewDrillHtml(l); /* AQ 工位四：复习末尾恰一道真题 */
    }
  }
  h+="</div>";
  $("#rin").innerHTML=h;
  renderNav();
  $("#room").scrollTop=0;
  markView();
}
function reviewReveal(){R.revealed.ans=true;renderReview();}
function reviewJudge(ok){
  var l=R.level,c=ensureCase(l.id),rk=reviewKind(c,l),last=isLastRung(c.g);
  c.hits.push({t:now(),ok:!!ok,ms:0,kind:rk.kind,fresh:rk.kind==="生题"});
  c.seen=(c.seen||0)+1;
  if(ok){c.g=Math.min((c.g||0)+1,INT.length-1);}
  else{c.g=0;(WB[l.id]=WB[l.id]||[]).push({t:now(),which:rk.kind});}
  /* AP 调度分层：挂活生成器判对间隔×1.5；AQ 工位五 v2：末触判对 → due=0 收口，不再排期亦永不蒙尘 */
  c.due=(ok&&last)?0:now()+Math.round(intAt(c.g)*DAY*(ok?genFactor(l):1));
  R.committed.judge=ok?1:0;
  R.exKey=pickReviewDrill(l); /* AQ 工位四：判词落定即选定尾题（一次选定，重渲不换题） */
  save();renderReview();buildWall();drawPlan();
}

/* ===================== 知识图谱（P20 · tools/math/buildmap.json v2）=====================
   用户亲令（2026-08-06）：「脉络太冗杂，光一章就多得难以辨认」→ 废章级细图；
   「先做好高数部分，做成 graph 形式」「要知识层面的脉络，不是题型——像个知识图谱」
   「别按小节名字做（后面章还没写），按知识本身的体系、联系做」
   「目标：对整个高数知识体系有数形结合式的深入认知」。落地两件：
   · 大地图＝**一张高数全景图谱**（?map=1／墙顶「脉络」chip）：40 件／56 边、fable 手排坐标直读，
     地基（极限）在底、微分与积分双塔并立、N-L 横梁居中、金线（spine）自 N-L 爬到斯托克斯。
   · 小地图＝关内一阶子图（首拍尾部「脉络」块）：本关命中件（at 含本关）＋一阶邻居，三栏＋自动文案。
   数据＝ build 期注入的 __MATH.buildmap={graph:{t,spine,nodes,edges},canvas}（缺件＝空图，壳侧优雅缺席）。
   投影律：染色由 at 关的 progressOf 渲染期派生；选中/悬读全在内存，永不落盘。
   零动画：一切换装＝原地 innerHTML，无 transition/animation。 */
var BMKIND={"概念":"概","定理":"定","公式":"式"};
var BMRELS={"奠基":1,"推出":1,"统一":1,"推广":1,"对偶":1,"工具":1};
var BMDAG={"奠基":1,"推出":1,"推广":1};   /* 建构依赖三种：参与无环闸（统一/对偶/工具表用途，不表证明依赖） */
/* rel 一句人话（口径出自 buildmap._meta 的关系定义，非壳侧编造） */
var BMSAY={"奠基":"没有它就没有它","推出":"由它证得／长出","统一":"两侧焊成同一件事",
           "推广":"同一件事升一层维度","对偶":"一体两面 · 互为逆","工具":"施工时要用它"};
/* 线型（class → CSS）：奠基·推出实线 r1／工具虚线 r2／统一加粗 r3／对偶点划 r4／推广实线带箭头 r5。
   五档染色（class → CSS）：p0 未学沉墨／p1 学过半明／p2 精通金／p3 蒙尘哑金／pu 未开讲（更暗一档）。
   **一律不写 SVG presentation attribute**——属性里的 var() 是规范未定区，见 CSS 段长注。 */
var BMLINE={"奠基":"r1","推出":"r1","工具":"r2","统一":"r3","对偶":"r4","推广":"r5"};
var BMPC={unlearned:"p0",learned:"p1",mastered:"p2",dusty:"p3"};
var BMSTN={unlearned:"未学",learned:"学过",mastered:"精通",dusty:"蒙尘"};
var BMRANK={unlearned:0,learned:1,dusty:2,mastered:3};   /* 一件挂多关：取最高那一档染色 */
/* 手排坐标的**壳侧微调**（SPEC_P20 件二授权 ≤±2 格）：数据正本零改动，只在渲染期叠加。
   每一处都是 bmUnitMin 自动碰撞算法点名的「瓶颈对」——它们把整图的最小可读缩放顶高，
   拉开一两格后全图就能在桌面一屏内等比铺开（回执逐个点名）。 */
var BMNUDGE={ode:[1,1],odeN:[0,-1],mvext:[-1,0],antid:[-1,0],powser:[1,0],improper:[0,-1]};
function bmPack(){var b=M&&M.buildmap;return (b&&typeof b==="object")?b:null;}
function bmGraph(){
  var p=bmPack(),g=p&&p.graph;
  return (g&&typeof g==="object"&&Array.isArray(g.nodes)&&g.nodes.length&&Array.isArray(g.edges))?g:null;

function bmCanvas(){var p=bmPack(),c=p&&p.canvas;
  return (c&&c.length===2&&+c[0]>0&&+c[1]>0)?[+c[0],+c[1]]:[100,72];}

function bmEdges(){var g=bmGraph();return g?g.edges:[];}
function bmNodeById(id){var ns=bmNodes(),i;for(i=0;i<ns.length;i++)if(ns[i].id===id)return ns[i];return null;}
function bmSpineSet(){var g=bmGraph(),a=(g&&g.spine)||[],s={},i;for(i=0;i<a.length;i++)s[a[i]]=1;return s;}
function bmAt(n){return (n&&Array.isArray(n.at))?n.at:[];}
function bmPos(n){ /* 手排坐标 ＋ 壳侧微调（数据正本不动） */
  var p=(n&&n.pos)||[0,0],d=BMNUDGE[n&&n.id];
  return d?[(+p[0])+d[0],(+p[1])+d[1]]:[+p[0],+p[1]];
}
function bmProg(n,t){ /* 已开讲＝at 中最高进度；at 空或全不在库＝未开讲（null＝预告态） */
  var at=bmAt(n),best=null,i,p;
  for(i=0;i<at.length;i++){
    if(!byId[at[i]])continue;
    p=progressOf(at[i],t);
    if(best===null||BMRANK[p]>BMRANK[best])best=p;
  }
  return best;
}
function bmGo(n){var at=bmAt(n),i;for(i=0;i<at.length;i++)if(byId[at[i]])return at[i];return null;}
function bmNodesAt(lid){var out=[];bmNodes().forEach(function(n){if(bmAt(n).indexOf(lid)>=0)out.push(n);});return out;}
function bmChLab(n){var c=n&&chById[n.ch];
  return c?("第"+chNumeral(n.ch)+"章 "+c.name):((n&&n.ch)||"");}
/* ————— 结构闸（selftest ⑳ 与 verify_content_math.py 同口径；缺件＝空图合法，内容未到不拦）————— */
function bmCheck(where,g,cv){
  if(!g||typeof g!=="object"||Array.isArray(g))return where+" 非对象";
  cv=(cv&&cv.length===2&&+cv[0]>0&&+cv[1]>0)?[+cv[0],+cv[1]]:null;
  if(!cv)return where+" canvas 非法";
  if(!String(g.t==null?"":g.t).trim())return where+".t 空";
  var nodes=g.nodes,edges=g.edges,i,j,k;
  if(!Array.isArray(nodes)||!nodes.length)return where+".nodes 空";
  if(!Array.isArray(edges))return where+".edges 非数组";
  var ids={};
  for(i=0;i<nodes.length;i++){
    var n=nodes[i],tag=where+".nodes["+i+"]";
    if(!n||typeof n!=="object")return tag+" 非对象";
    var id=String(n.id==null?"":n.id);
    if(!id.trim())return tag+".id 空";
    if(ids[id])return tag+".id 重复: "+id;
    ids[id]=1;
    if(!String(n.t==null?"":n.t).trim())return tag+"("+id+").t 空";
    if(!String(n.why==null?"":n.why).trim())return tag+"("+id+").why 空";
    if(!BMKIND[n.k])return tag+"("+id+").k 非法: "+n.k;
    var p=n.pos;
    if(!(Array.isArray(p)&&p.length===2&&typeof p[0]==="number"&&typeof p[1]==="number"
         &&isFinite(p[0])&&isFinite(p[1])))return tag+"("+id+").pos 须二元数值";
    if(p[0]<0||p[0]>cv[0]||p[1]<0||p[1]>cv[1])return tag+"("+id+").pos 出画布: "+p.join(",");
    if(!Array.isArray(n.at))return tag+"("+id+").at 须数组（空＝该章未开讲）";
  }
  if(g.spine!==undefined&&!Array.isArray(g.spine))return where+".spine 非数组";
  var sp=g.spine||[];
  for(i=0;i<sp.length;i++)if(!ids[sp[i]])return where+".spine 引用不存在的件: "+sp[i];
  var der=[];
  for(i=0;i<edges.length;i++){
    var e=edges[i],et=where+".edges["+i+"]";
    if(!e||typeof e!=="object")return et+" 非对象";
    if(!ids[e.f])return et+".f 端点不存在: "+e.f;
    if(!ids[e.to])return et+".to 端点不存在: "+e.to;
    if(e.f===e.to)return et+" 自环: "+e.f;
    if(!BMRELS[e.rel])return et+".rel 非法: "+e.rel;
    if(!String(e.why==null?"":e.why).trim())return et+".why 空";
    if(BMDAG[e.rel])der.push(e);
  }
  /* 「奠基/推出/推广」子图无环（Kahn；统一/对偶/工具不参与环检——它们表用途不表证明依赖） */
  var part={},indeg={},adj={},q=[],tot=0,cnt=0;
  for(i=0;i<der.length;i++){part[der[i].f]=1;part[der[i].to]=1;}
  for(k in part){if(!Object.prototype.hasOwnProperty.call(part,k))continue;indeg[k]=0;adj[k]=[];tot++;}
  for(i=0;i<der.length;i++){adj[der[i].f].push(der[i].to);indeg[der[i].to]++;}
  for(k in part){if(Object.prototype.hasOwnProperty.call(part,k)&&!indeg[k])q.push(k);}
  while(q.length){var v=q.pop();cnt++;
    for(j=0;j<adj[v].length;j++){if(--indeg[adj[v][j]]===0)q.push(adj[v][j]);}}
  if(cnt!==tot)return where+" 「奠基/推出/推广」边成环";
  return null;
}
/* ————— 度量：字宽实测与折行（SVG 无自动折行，必须自己切）—————
   走 canvas measureText 拿真宽（字体取 --cjk 正本），单字符结果缓存；canvas 不可用才回落估值。
   估值曾把 ∫ 之类数学符号按半角算，实测在宋体族里是全角 ⇒ 文字冲出盒外（P19 实拍抓到）。 */
function bmScale(){var f=fzEff()||1;return Math.min(2.0,Math.max(.85,f));}   /* 域给宽，图爆宽由横滚吸收 */
function bmScrHint(el){ /* 真能横滚才挂右缘渐隐（装得下时不挂，最右一列不被吃掉） */
  if(!el)return;
  try{el.classList[(el.scrollWidth>el.clientWidth+2)?"add":"remove"]("xscr");}catch(e){}
}
function bmCw(c){var x=c.charCodeAt(0);
  if(x<0x2000)return 0.58;                                   /* 拉丁/数字/常用标点 */
  if(x>=0xff61&&x<=0xff9f)return 0.55;                        /* 半角片假名 */
  return 1;}                                                  /* CJK、全角标点、数学符号（宋体族按全角出） */
var BMCTX,BMCWC={},BMFONT="";
function bmFont(){
  if(!BMFONT){
    try{BMFONT=(getComputedStyle(document.documentElement).getPropertyValue("--cjk")||"").trim();}catch(e){}
    if(!BMFONT)BMFONT='"Songti SC","Noto Serif CJK SC","STSong","SimSun",serif';
  }
  return BMFONT;
}
function bmChW(c,fs){
  var k=c+"|"+fs;
  if(BMCWC[k]!==undefined)return BMCWC[k];
  var w=null;
  if(BMCTX===undefined){try{BMCTX=document.createElement("canvas").getContext("2d");}catch(e){BMCTX=null;}}
  if(BMCTX){try{BMCTX.font=fs+"px "+bmFont();w=BMCTX.measureText(c).width;}catch(e){w=null;}}
  if(!(w>0))w=bmCw(c)*fs;
  BMCWC[k]=w;return w;
}
function bmTw(s,fs){var w=0,i;for(i=0;i<s.length;i++)w+=bmChW(s.charAt(i),fs);return w;}
function bmWrap(s,maxw,fs,maxl){
  s=String(s==null?"":s);
  var lines=[],cur="",w=0,i;
  for(i=0;i<s.length;i++){
    var c=s.charAt(i),cw=bmChW(c,fs);
    if(w+cw>maxw&&cur){lines.push(cur);cur="";w=0;}
    cur+=c;w+=cw;
  }
  if(cur)lines.push(cur);
  if(!lines.length)lines=[""];
  if(lines.length>maxl){
    lines=lines.slice(0,maxl);
    var last=lines[maxl-1];
    lines[maxl-1]=(last.length>1?last.slice(0,last.length-1):last)+"…";
  }
  return lines;
}
/* ————— 节点盒度量（只随字号，不随缩放）：件名折行 ≤2 行，盒宽随最长行、封顶 MAXW ————— */
function bmBoxes(nodes,sc){
  var FS=11.4*sc,LH=13.2*sc,FK=7.6*sc,PX=6.4*sc,PT=12.4*sc,PB=6*sc;
  var MAXW=98*sc,MINW=40*sc,B={};
  nodes.forEach(function(n){
    var ls=bmWrap(n.t,MAXW-PX*2,FS,2),w=0;
    ls.forEach(function(s){var x=bmTw(s,FS);if(x>w)w=x;});
    B[n.id]={lines:ls,w:Math.max(MINW,Math.min(MAXW,Math.ceil(w+PX*2))),h:PT+ls.length*LH+PB};
  });
  return {B:B,FS:FS,LH:LH,FK:FK,PX:PX,PT:PT,sc:sc};
}
/* 「零重叠」的最小单位尺度：任两件在缩放 U 下要么横向让开、要么纵向让开。
   对每一对求「刚好让开」的 U，取全局最大 ⇒ 图再密也不会字压字（实测替代拍脑袋常数）。
   顺带记下最紧的几对（BMTIGHT），供工位定位该微调谁——手排坐标只微调、绝不重排。 */
var BMTIGHT=[];
function bmUnitMin(nodes,MT){
  var GX=9*MT.sc,GY=6*MT.sc,U=0,i,j,pairs=[];
  for(i=0;i<nodes.length;i++)for(j=i+1;j<nodes.length;j++){
    var a=nodes[i],b=nodes[j],pa=bmPos(a),pb=bmPos(b),ba=MT.B[a.id],bb=MT.B[b.id];
    var dx=Math.abs(pa[0]-pb[0]),dy=Math.abs(pa[1]-pb[1]);
    var ux=dx>0?((ba.w+bb.w)/2+GX)/dx:1e9,uy=dy>0?((ba.h+bb.h)/2+GY)/dy:1e9;
    var u=Math.min(ux,uy);
    if(u>U)U=u;
    pairs.push([a.id,b.id,u]);
  }
  pairs.sort(function(p,q){return q[2]-p[2];});
  BMTIGHT=pairs.slice(0,10);
  return U;
}
/* ————— 大地图布局：手排坐标直读（等比缩放＋包围盒平移），零拓扑算法 ————— */
function bmLayout(W,availH){
  var g=bmGraph();if(!g)return null;
  var sc=bmScale(),nodes=g.nodes,MT=bmBoxes(nodes,sc),PAD=9*sc;
  var umin=bmUnitMin(nodes,MT);
  function bbox(U){
    var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    nodes.forEach(function(n){
      var p=bmPos(n),b=MT.B[n.id],cx=p[0]*U,cy=p[1]*U;
      if(cx-b.w/2<x0)x0=cx-b.w/2;
      if(cx+b.w/2>x1)x1=cx+b.w/2;
      if(cy-b.h/2<y0)y0=cy-b.h/2;
      if(cy+b.h/2>y1)y1=cy+b.h/2;
    });
    return [x0,y0,x1,y1];
  }
  /* 二分最大可容单位：宽恒查，高只在「一屏全图」口径下查（桌面/iPad）；
     一件都压不下（U<umin）时按 umin 出图，超出部分由容器横滚/页面纵滚吸收（移动端常态）。 */
  var lo=umin,hi=Math.max(umin,64*sc),U=umin,k,mid,bb;
  for(k=0;k<20;k++){
    mid=(lo+hi)/2;bb=bbox(mid);
    if((bb[2]-bb[0]+PAD*2)<=W&&(!availH||(bb[3]-bb[1]+PAD*2)<=availH)){U=mid;lo=mid;}
    else hi=mid;
  }
  bb=bbox(U);
  var ox=PAD-bb[0],oy=PAD-bb[1],N={},base=null,ybase=-1e9;
  nodes.forEach(function(n){
    var p=bmPos(n),b=MT.B[n.id];
    var d={n:n,x:p[0]*U+ox-b.w/2,y:p[1]*U+oy-b.h/2,w:b.w,h:b.h,lines:b.lines};
    N[n.id]=d;
    if(p[1]>ybase){ybase=p[1];base=d;}    /* 地基＝y 最大者（移动首帧视口锚） */
  });
  return {W:bb[2]-bb[0]+PAD*2,H:bb[3]-bb[1]+PAD*2,N:N,U:U,umin:umin,base:base,
          FS:MT.FS,LH:MT.LH,FK:MT.FK,PX:MT.PX,PT:MT.PT,sc:sc};
}
/* ————— 绘制原件：节点盒 / 边（中心到中心的直线，两端裁到盒边）————— */
function bmNodeSvg(id,LO,cls,t,SP){
  var d=LO.N[id];if(!d||!d.n)return "";
  var n=d.n,pr=bmProg(n,t),pc=pr?(BMPC[pr]||"p0"):"pu";
  var h='<g class="bmn'+(cls?" "+cls:"")+((SP&&SP[id])?" sp":"")+'" data-act="bmnode" data-id="'+esc(id)+'">'
    +"<title>"+esc(n.t+" · "+n.why)+"</title>"
    +'<rect class="bmr '+pc+'" x="'+fnum(d.x)+'" y="'+fnum(d.y)+'" width="'+fnum(d.w)
    +'" height="'+fnum(d.h)+'" rx="4" ry="4"/>'
    +'<text class="bmk '+pc+'" x="'+fnum(d.x+LO.PX)+'" y="'+fnum(d.y+LO.FK+3.6*LO.sc)+'" font-size="'+fnum(LO.FK)+'">'
    +esc(BMKIND[n.k]||"·")+"</text>";
  d.lines.forEach(function(s,i){
    h+='<text class="bmt '+pc+'" x="'+fnum(d.x+LO.PX)+'" y="'+fnum(d.y+LO.PT+(i+1)*LO.LH-3*LO.sc)
      +'" font-size="'+fnum(LO.FS)+'">'+esc(s)+"</text>";
  });

}
function bmClip(cx,cy,w,h,tx,ty,pad){ /* 自盒心朝目标射出，取与盒边（外扩 pad）的交点＝连线端点 */
  var dx=tx-cx,dy=ty-cy;
  if(!dx&&!dy)return [cx,cy];
  var hw=w/2+(pad||0),hh=h/2+(pad||0);
  var s=Math.min(dx?hw/Math.abs(dx):1e9,dy?hh/Math.abs(dy):1e9);
  return [cx+dx*s,cy+dy*s];
}
function bmEdgeSvg(e,i,LO,mode,opt){
  var a=LO.N[e.f],b=LO.N[e.to];if(!a||!b)return "";
  var ln=BMLINE[e.rel]||"r2",o=opt||{};
  var ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2;
  var p1=bmClip(ax,ay,a.w,a.h,bx,by,1.6*LO.sc),p2=bmClip(bx,by,b.w,b.h,ax,ay,2.4*LO.sc);
  var d="M"+fnum(p1[0])+" "+fnum(p1[1])+"L"+fnum(p2[0])+" "+fnum(p2[1]),ar="";
  if(o.arrow){                                   /* 末端小三角（大地图只「推广」画，小地图三栏全画） */
    var vx=p2[0]-p1[0],vy=p2[1]-p1[1],L=Math.sqrt(vx*vx+vy*vy)||1,ux=vx/L,uy=vy/L;
    var s=4.6*LO.sc,wd=2.7*LO.sc;
    ar='<polygon points="'+fnum(p2[0])+","+fnum(p2[1])+" "
      +fnum(p2[0]-ux*s-uy*wd)+","+fnum(p2[1]-uy*s+ux*wd)+" "
      +fnum(p2[0]-ux*s+uy*wd)+","+fnum(p2[1]-uy*s-ux*wd)+'"/>';
  }
  return '<g class="bmeg '+ln+(o.gold?" spn":"")+(mode==="dim"?" dim":(mode==="on"?" on":""))+'">'
    +'<path class="bme" d="'+d+'"/>'+ar
    +'<path class="bmhit" d="'+d+'" data-act="bmedge" data-i="'+i+'"><title>'
    +esc(e.rel+" · "+e.why)+"</title></path></g>";
}
function bmSvgWrap(W,H,body){
  /* width/height 钉成 px 且＝viewBox 尺寸 ⇒ 缩放恒 1（px 即 px，字号不被拉伸）；
     图宽超出容器时由 .mapbox/.bmsub 的 overflow-x 横滚（滚动条全局已隐）。 */
  return '<svg class="bmsvg" width="'+fnum(W)+'" height="'+fnum(H)+'" viewBox="0 0 '+fnum(W)+" "+fnum(H)+'">'
    +'<rect x="0" y="0" width="'+fnum(W)+'" height="'+fnum(H)+'" fill="transparent" data-act="bmbg"/>'
    +body+"</svg>";
}
/* ————— 大地图整图 ————— */
var MAPLO=null;
function bmMapSvg(W,availH,sel,hl){
  var LO=bmLayout(W,availH);if(!LO)return "";
  MAPLO=LO;
  var t=now(),SP=bmSpineSet(),edges=bmEdges(),focus=null,nb={},eon={},body="",eg="";
  if(sel&&LO.N[sel]){focus={};focus[sel]=1;}
  else if(hl){bmNodesAt(hl).forEach(function(n){if(LO.N[n.id]){focus=focus||{};focus[n.id]=1;}});}
  if(focus){
    Object.keys(focus).forEach(function(k){nb[k]=1;});
    edges.forEach(function(e,k){if(focus[e.f]||focus[e.to]){eon[k]=1;nb[e.f]=1;nb[e.to]=1;}});
  }
  edges.forEach(function(e,k){
    eg+=bmEdgeSvg(e,k,LO,focus?(eon[k]?"on":"dim"):"",
                  {arrow:e.rel==="推广",gold:!!(SP[e.f]&&SP[e.to])});
  });
  bmNodes().forEach(function(n){
    body+=bmNodeSvg(n.id,LO,focus?(focus[n.id]?"sel":(nb[n.id]?"":"dim")):"",t,SP);
  });
  return bmSvgWrap(LO.W,LO.H,eg+body);
}
function bmLgd(){
  return '<div class="maplg"><s><u class="r1"></u>奠基·推出</s><s><u class="r5"></u>推广 ▸</s>'
    +'<s><u class="r3"></u>统一</s><s><u class="r4"></u>对偶</s><s><u class="r2"></u>工具</s>'
    +'<s><u class="sp"></u>金线 · 边界读内部</s></div>'
    +'<div class="maplx">沉墨未学 · 半明学过 · 金精通 · 哑金蒙尘；最暗一档＝该章未开讲</div>';
}
function bmPanHtml(sel,edge){
  var edges=bmEdges(),e,a,b;
  if(edge!==null&&edge!==undefined&&(e=edges[edge])){
    a=bmNodeById(e.f);b=bmNodeById(e.to);
    return '<div class="bmpk">关系 · '+esc(e.rel)+"</div>"
      +'<div class="bmpt">'+esc((a&&a.t)||e.f)+"　⟶　"+esc((b&&b.t)||e.to)+"</div>"
      +'<div class="bmpw">'+esc(e.why)+"</div>"
      +'<div class="bmpl">'+esc(BMSAY[e.rel]||"")+"</div>";
  }
  var n=sel?bmNodeById(sel):null;
  if(!n)return '<div class="bmpe">点图上任一件：看它在大厦里的角色、由什么长出、又为谁而造。</div>'+bmLgd();
  var t=now(),pr=bmProg(n,t),at=bmAt(n).filter(function(x){return byId[x];}),ups=[],dns=[],go=bmGo(n);
  edges.forEach(function(x){
    var o;
    /* 关系走 mono 微签而非括号后缀——件名本身常自带括号，再套一层就成了双括号 */
    if(x.to===n.id&&(o=bmNodeById(x.f)))ups.push(esc(o.t)+"<i>"+esc(x.rel)+"</i>");
    if(x.f===n.id&&(o=bmNodeById(x.to)))dns.push(esc(o.t)+"<i>"+esc(x.rel)+"</i>");
  });
  return '<div class="bmpk">'+esc(n.k)+(bmSpineSet()[n.id]?" · 金线":"")+"</div>"
    +'<div class="bmpt">'+esc(n.t)+"</div>"
    +'<div class="bmpw">'+esc(n.why)+"</div>"
    +'<div class="bmpl">'+esc(bmChLab(n))+" · "
    +(pr?("已开讲 · "+esc(BMSTN[pr])+(at.length>1?(" · "+at.length+" 关"):"")):"未开讲")+"</div>"
    +(ups.length?'<div class="bmpn"><i>用到</i>'+ups.join("、")+"</div>":"")
    +(dns.length?'<div class="bmpn"><i>为谁</i>'+dns.join("、")+"</div>"
                :'<div class="bmpn"><i>为谁</i><em>图上到此收口</em></div>')
    +(go?'<button class="bmpgo" data-act="bmgo" data-k="'+esc(go)+'">进入该关 ⟶</button>':"");
}
/* ————— 大地图页（层＝{v:"page",p:"map"}，走既有 goPage/renderLayer 栈式返回）————— */
var MAPV={sel:null,edge:null,hl:null,bk:"墙"},MAPHOV=null,MAPHOME=false;
function mapHtml(){
  var g=bmGraph();
  var h='<div class="ph">'+esc((g&&g.t)||"高等数学 · 知识图谱")+"</div>"
    +'<div class="psub">地基在下 · 双塔并立 · 金线＝边界读内部</div>';
  if(!g)return h+'<div class="empty">知识图谱尚未铺设。<br>内容落库即现（tools/math/buildmap.json）。</div>';
  return h+'<div class="mapv"><div class="mapbox"></div><div class="mappan"></div></div>';

function mapFill(){
  var box=$(".mapbox"),pan=$(".mappan"),pg=$("#page");
  if(!box||!bmGraph())return;
  var w=Math.max(240,Math.round(box.clientWidth||box.getBoundingClientRect().width||760));
  var availH=0;
  if(!mqStatic()){                    /* 桌面/iPad（>900）＝一屏全图（宽高双约束等比）；移动＝宽优先，超出即内滚 */
    var r=box.getBoundingClientRect();
    /* 余量＝图例/面板底缘 + #pin 底衬（4rem）：扣足了「整页不滚」才算真一屏 */
    availH=Math.max(240,Math.round(window.innerHeight-r.top-104*bmScale()));
  }
  var sl=box.scrollLeft,pt=pg?pg.scrollTop:0;    /* 原地换装不丢滚动位置（选中态重绘常态） */
  box.innerHTML=bmMapSvg(w,availH,MAPV.sel,MAPV.hl);
  box.scrollLeft=sl;if(pg)pg.scrollTop=pt;
  bmScrHint(box);
  if(pan)pan.innerHTML=bmPanHtml(MAPV.sel,MAPV.edge);
  mapWire();
  if(MAPHOME){MAPHOME=false;mapHome();}
}
function mapHome(){ /* 移动首帧落在地基区（图底部＝函数·极限那一带）：横向对准地基件、纵向落到图底 */
  var box=$(".mapbox"),pg=$("#page"),d=MAPLO&&MAPLO.base;
  if(!box||!mqStatic())return;   /* 一屏全图的桌面/iPad 无需对位（图本就整幅在眼前） */
  if(d)box.scrollLeft=Math.max(0,Math.round(d.x+d.w/2-box.clientWidth/2));
  if(pg)pg.scrollTop=Math.max(0,pg.scrollHeight-pg.clientHeight);
}
function mapHover(kind,val){ /* 桌面悬读：只换面板文字，不动图（选中态照旧） */
  var pan=$(".mappan");
  if(!pan||!bmGraph())return;
  if(kind==="node")pan.innerHTML=bmPanHtml(val,null);
  else if(kind==="edge")pan.innerHTML=bmPanHtml(null,val);
  else pan.innerHTML=bmPanHtml(MAPV.sel,MAPV.edge);
}
function mapWire(){
  var box=$(".mapbox");if(!box||box.__bmwired)return;box.__bmwired=true;
  box.addEventListener("mouseover",function(e){
    var t=(e.target&&e.target.closest)?e.target.closest("[data-act]"):null;
    var a=t?t.getAttribute("data-act"):null;
    if(a==="bmnode"){MAPHOV=1;mapHover("node",t.getAttribute("data-id"));}
    else if(a==="bmedge"){MAPHOV=1;mapHover("edge",+t.getAttribute("data-i"));}
    else if(a==="bmbg"&&MAPHOV){MAPHOV=null;mapHover(null);}
  });
  box.addEventListener("mouseleave",function(){if(MAPHOV){MAPHOV=null;mapHover(null);}});
}
function mapPage(){showPage(mapHtml());document.body.classList.add("mapw");mapFill();}
function openMap(hl){
  MAPV={sel:null,edge:null,hl:hl||null,bk:hl?"关":"墙"};MAPHOME=true;
  goPage({v:"page",p:"map",hl:MAPV.hl,bk:MAPV.bk},mapPage);
}
/* ————— 小地图：关内一阶子图（上游左／本关中／下游右）————— */
var BSEL=null;
function bmSub(lid){
  var g=bmGraph();if(!g)return null;
  var mid=bmNodesAt(lid);if(!mid.length)return null;
  var isM={},up=[],dn=[],ue=[],de=[],sU={},sD={};
  mid.forEach(function(n){isM[n.id]=1;});
  g.edges.forEach(function(e){
    var o;
    if(isM[e.to]&&!isM[e.f]){ue.push(e);if(!sU[e.f]&&(o=bmNodeById(e.f))){sU[e.f]=1;up.push(o);}}
  });
  g.edges.forEach(function(e){
    var o;   /* 既作上游又作下游者归上游一列（同一件不占两格，边照画） */
    if(isM[e.f]&&!isM[e.to]){de.push(e);if(!sD[e.to]&&!sU[e.to]&&(o=bmNodeById(e.to))){sD[e.to]=1;dn.push(o);}}
  });
  return {lid:lid,mid:mid,up:up,dn:dn,E:ue.concat(de)};
}
function bmSubLayout(sub,W){
  var sc=bmScale()*0.94;
  var FS=10.8*sc,LH=12.8*sc,FK=7.6*sc,PX=6*sc,PT=12.4*sc,PB=6*sc;
  var PAD=4*sc,CG=Math.max(20,26*sc),VG=7*sc,MINW=88*sc,MAXW=196*sc,HD=15*sc;
  var cols=[],heads=[];
  if(sub.up.length){cols.push(sub.up);heads.push("上游");}
  cols.push(sub.mid);heads.push("本关");
  if(sub.dn.length){cols.push(sub.dn);heads.push("下游");}
  var avail=Math.max(120,W-PAD*2);
  /* 列宽有下限（读得清）也有上限（三栏别摊成三条空条），装不下即横滚（同大地图口径） */
  var nw=Math.max(MINW,Math.min(MAXW,Math.floor((avail-(cols.length-1)*CG)/cols.length)));
  var span=cols.length*nw+(cols.length-1)*CG;
  var inner=Math.max(avail,span),x0=PAD+(inner-span)/2;
  var lines={},maxl=1;
  cols.forEach(function(list){list.forEach(function(n){
    var ls=bmWrap(n.t,nw-PX*2,FS,3);lines[n.id]=ls;if(ls.length>maxl)maxl=ls.length;});});
  var nh=PT+maxl*LH+PB,rows=1;
  cols.forEach(function(list){if(list.length>rows)rows=list.length;});
  var body=rows*nh+(rows-1)*VG,H=PAD*2+HD+body,N={},HDS=[];
  cols.forEach(function(list,ci){
    var colH=list.length*nh+(list.length-1)*VG,y0=PAD+HD+(body-colH)/2,cx=x0+ci*(nw+CG);
    HDS.push({t:heads[ci],x:cx,y:PAD+FK});
    list.forEach(function(n,k){

/* ===================== selftest（?selftest=1 → MATH PASS N/N） ===================== */
function walkStrings(x,cb){
  if(typeof x==="string")cb(x);
  else if(Array.isArray(x))x.forEach(function(v){walkStrings(v,cb);});
  else if(x&&typeof x==="object")Object.keys(x).forEach(function(k){walkStrings(x[k],cb);});
}
function walkKV(x,cb){
  if(Array.isArray(x))x.forEach(function(v){walkKV(v,cb);});
  else if(x&&typeof x==="object")Object.keys(x).forEach(function(k){cb(k,x[k]);walkKV(x[k],cb);});
}
function countDollar(s){var n=0;for(var i=0;i<s.length;i++){if(s[i]==="\\"){i++;continue;}if(s[i]==="$")n++;}return n;}
function collectTex(l){
  var out=[];
  walkKV(l,function(k,v){if(k==="katex"&&typeof v==="string"&&v.trim())out.push({t:v,d:true});});
  walkStrings(l,function(s){
    var tmp=s.replace(/\\\$/g," "),m;
    var re1=/\$\$([\s\S]+?)\$\$/g;while((m=re1.exec(tmp)))out.push({t:m[1],d:true});
    var rest=tmp.replace(/\$\$[\s\S]+?\$\$/g," "),re2=/\$([^\$]+?)\$/g;
    while((m=re2.exec(rest)))out.push({t:m[1],d:false});
  });
  return out;
}
function selftest(){

  T("① __MATH 加载·levels 非空",function(){return (LEVELS.length>0&&CHAPTERS.length>0)||"levels="+LEVELS.length;});

  SUBJECTS.forEach(function(s){s.chs.forEach(function(c){(byChapter[c]||[]).forEach(function(l){flat.push(l);});});});
  flat.slice(0,n).forEach(function(l,i){

/* ===================== 字号旋钮（A−/A+ · 域 0.7~2.4 · 步 0.1 · 存 ky_math_fz） =====================
   仿 universe.html #knob：改 --fz，html/body font-size 全走 calc(基准*var(--fz))；rem-only 布局整体缩放。
   自调用即恢复存档字号，不入 boot，selftest/reset 各路径零干扰。 */
var MFZ_KEY="ky_math_fz";
var MFZ=(function(){
  var qf=parseFloat(Q.get("fz"));if(qf&&!isNaN(qf))return Math.min(3.0,Math.max(.5,qf)); /* ?fz=1.7 调试参：只生效不落盘 */
  var v=parseFloat(localStorage.getItem(MFZ_KEY));if(!v||isNaN(v))return 1;if(v>10)v=v/100;return Math.min(3.0,Math.max(.5,v));})();
function fzEff(){return window.__KY_CLAMPED?Math.min(2.0,MFZ):MFZ;} /* B3：窄屏钳制时生效值 cap 2.0（存储值不动，显示%=生效值） */
function syncFzOut(){var t=Math.round(fzEff()*100)+"%";$$(".fzpct").forEach(function(p){p.textContent=t;});}
function applyFz(){
  document.documentElement.style.setProperty("--fz",fzEff());
  syncFzOut();              /* 双实例读数同步（浮钮 #fzctl + 移动端房内展开条 .rtfz） */
  try{fitPlan();}catch(e){} /* rem 一变，安排牌高度与墙顶垫距同步重算 */
  try{figMountAll();}catch(e){} /* 图讲字号点径随 rem 基准重钉（在场才有事做，无图零开销） */
  try{bmRemount();}catch(e){}   /* P19：建构图字号随 --fz 成比例（bmScale），换档即重排 */
  try{fitWide();}catch(e){}     /* P16 件五：字号一变，哪些段落算「超宽」也跟着变 */}
function stepFz(k){ /* 字号步进（委托口径：浮钮与房内展开条同一处逻辑，仿 vocab 追记十五双实例委托） */
  if(k==="+")MFZ=Math.min(3.0,Math.max(.5,Math.round((MFZ+0.1)*100)/100));
  else if(k==="-")MFZ=Math.min(3.0,Math.max(.5,Math.round((MFZ-0.1)*100)/100));

/* ————— P18 件一（共犯）· 窄屏钳迟滞版（adapter_math.js 已置 mobile.noClamp=true，职责整个搬到这里）—————
   sync_core 的原判据 `innerWidth<500` 是**自反**的：钳上 width=500 后 innerWidth 恰好读回 500，
   500<500 为假 ⇒ 立刻撤钳 ⇒ 读回 428 ⇒ 再钳……428pt 机上实测每 ~125ms 一次、10 秒内 84 次视口切换、
   83 次 resize 事件；缩放比在 1.000/1.168 之间跳，#room clientHeight 926⇄1082、scrollHeight 11214⇄11968，
   滚动位置随之乱窜——它既是黑块的放大器（iOS 每次改 viewport meta 都重建滚动/合成层），
   也是件二「转屏一轮位置就不同」的第二个源头。vocab 追记十五已记此坑「真机未证」，本轮真机症状对上了。
   修：以「配置键＝屏幕尺寸+方向」作迟滞——同一配置下判定一次即锁，绝不来回；
   配置真变了（转屏/改窗/分屏）才撤钳、60ms 后按真实 innerWidth 复判一次定案。
   保住原有正确行为：横屏 926pt 仍会撤钳（否则成 1.85x 放大镜），__KY_CLAMPED 与 ky:reclamp 广播口径不变。
   公共正本 sync_core.js 一字未改，故 408/五更书/词汇三壳不受影响。 */
var CLW=500,CLKEY=null,CLRZ=0;
function vpMeta(){
  var m=document.querySelector("meta[name=viewport]");
  if(!m){m=document.createElement("meta");m.setAttribute("name","viewport");document.head.appendChild(m);}
  return m;
}
function clampKey(){
  var s=window.screen||{};
  return [s.width||0,s.height||0,mq("(orientation:landscape)")?"L":"P"].join("x");
}
function setClamp(on){
  var m=vpMeta();
  var want=on?"width=500, viewport-fit=cover":"width=device-width, initial-scale=1, viewport-fit=cover";
  if(m.getAttribute("content")!==want)m.setAttribute("content",want);
  if(window.__KY_CLAMPED!==on){window.__KY_CLAMPED=on;
    try{window.dispatchEvent(new Event("ky:reclamp"));}catch(e){}}
}
function mReclamp(){
  var k=clampKey();
  if(window.__KY_CLAMPED){
    if(k===CLKEY)return;                        /* 同配置已判定过：保持钳态，振荡断根 */
    setClamp(false);CLKEY=null;                 /* 配置变了：先撤钳，60ms 后按真实 innerWidth 复判 */
    setTimeout(mReclamp,60);return;
  }
  setClamp((window.innerWidth||9999)<CLW);
  CLKEY=k;
}
try{
  mReclamp();
  window.addEventListener("orientationchange",function(){clearTimeout(CLRZ);CLRZ=setTimeout(mReclamp,120);});
  window.addEventListener("resize",function(){clearTimeout(CLRZ);CLRZ=setTimeout(mReclamp,120);});
}catch(e){}

    if(merged==null)return {key:st.key,what:"empty"};
    var sigM=lib.sig(merged);
    if(local==null||sigM!==lib.sig(local)){st.set(clone(merged));what="pulled";}
    if(genAuth){                                                     /* 翻代：采纳云端、清本店 shadow、记新代，不回推（E2-b） */
      if(lib.shadowPick)shadowSet(st.key,lib.shadowPick(merged));
      sgenSet(st.key,remoteGen);
      return {key:st.key,what:what};
    }
    var needPush = (remote==null) ? !(lib.virgin(merged)&&!force)
                                  : sigM!==lib.sig(remote);
    if(force==="pullAll")needPush=false;
    if(force==="pushAll"&&lib.shadowPick)shadowSet(st.key,lib.shadowPick(local));  /* 推平跳过旧 shadow 基线：先立本地 starred 为新基线（E2-a） */
    if(needPush){
      var env={v:1,t:Date.now(),dev:cfg.dev||"dev",gen:envGen,data:merged};
      var attempt=function(n,sha){
        return push(st.key,env,sha).then(function(ok){
          if(ok===true)return;
          if(n>=2)throw new Error("上推冲突未决");
          return pull(st.key).then(function(p2){
            var r2=(p2.env&&p2.env.data!==undefined)?p2.env.data:null;
            if(force!=="pushAll"&&r2!=null)env.data=lib.merge(env.data,r2,{base:shadowGet(st.key)});  /* 推平 409 重试不合并：env.data 恒=local，只刷 sha（E2-a） */
            return attempt(n+1,p2.sha);
          });
        });
      };
      return attempt(0,p.sha).then(function(){
        var fin=(what==="pulled")?"pulled":"pushed";
        if(lib.sig(env.data)!==lib.sig(st.get())){st.set(clone(env.data));fin="pulled";}  /* 任一 push 成功后：合并果与本地不一致则本地采纳，否则 shadow 记了本地没有的星（E1） */
        if(lib.shadowPick)shadowSet(st.key,lib.shadowPick(env.data));
        sgenSet(st.key,envGen);                                      /* 代确立于推成功之后（推失败不抬本地代，避免旧档复活） */
        return {key:st.key,what:fin};
      });
    }
    if(lib.shadowPick)shadowSet(st.key,lib.shadowPick(merged));
    sgenSet(st.key,envGen);                                          /* 无回推路径（含首拉采纳/pullAll）也落代，避免采纳后再工作被误判翻代丢失 */
    return {key:st.key,what:what};
  });
}

function syncNow(manual,force){
  if(!A)return Promise.resolve();
  if(A.blocked&&A.blocked()){if(manual)setMsg("本页免写模式，不同步");return Promise.resolve();}
  loadCfg();
  if(!enabled()){if(manual)setMsg("未配置 token");renderStatus();return Promise.resolve();}
  if(busy){if(manual)setMsg("同步中…");return Promise.resolve();}
  busy=true;setMsg("同步中…");nearLimit=false;
  var changed=[],pushed=0,errs=[],settled=false,timer=0;
  var chain=Promise.resolve();
  A.stores.forEach(function(st){                                  /* 逐店 .catch 收集错误继续下店：一店坏（含 fetch 悬挂/坏文件）不拖垮整轮（E10） */
    chain=chain.then(function(){return syncStore(st,force);}).then(function(r){
      if(r&&r.what==="pulled")changed.push(r.key);
      if(r&&r.what==="pushed")pushed++;
    }).catch(function(e){errs.push({key:st.key,msg:String(e&&e.message||"错")});});
  });
  var done=chain.then(function(){
    if(settled)return;settled=true;clearTimeout(timer);
    busy=false;lastOkT=Date.now();
    if(errs.length)setMsg("✗ "+errs.length+"店失败:"+errs[0].msg.slice(0,28));
    else setMsg("✓ "+hhmm(lastOkT)+(changed.length?" 收"+changed.length:"")+(pushed?" 发"+pushed:"")+(nearLimit?" ⚠店近1MB界":""));
    if(changed.length&&A.applied){try{A.applied(changed);}catch(e){}}
  }).catch(function(e){
    if(settled)return;settled=true;clearTimeout(timer);
    busy=false;setMsg("✗ "+String(e&&e.message||"网络不通").slice(0,42));
  });
  var guard=new Promise(function(res){timer=setTimeout(function(){   /* 90s 硬超时：fetch 悬挂也不永久卡 busy（E10） */
    if(!settled){settled=true;busy=false;setMsg("✗ 超时");}res();
  },90000);});
  return Promise.race([done,guard]);
}

}

/* ---------------- 触屏与窄屏件（PROGRESS AI ⑤） ---------------- */
function mobilePatch(opt){
  opt=opt||{};
  try{ /* A1：standalone（PWA 加主屏/全屏）→ html.kysa，各壳 CSS 据 env(safe-area-inset) 让开刘海顶/Home 条底 */
    if(navigator.standalone===true||(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches))
      document.documentElement.classList.add("kysa");
  }catch(e){}
  try{ /* 窄屏视口钉 500：按「当前视口」判且随转屏重估——横屏 926pt 若仍钉 500 会成 1.85x 放大镜（审查官发现④） */
    if(!opt.noClamp){
      var reclamp=function(){
        var m=document.querySelector("meta[name=viewport]");
        if(!m){m=document.createElement("meta");m.setAttribute("name","viewport");document.head.appendChild(m);}
        var w=window.innerWidth||screen.width||9999;
        var clamp=!!(w&&w<500);
        var want=clamp?"width=500, viewport-fit=cover":"width=device-width, initial-scale=1, viewport-fit=cover";
        if(m.getAttribute("content")!==want)m.setAttribute("content",want);
        if(window.__KY_CLAMPED!==clamp){window.__KY_CLAMPED=clamp;   /* B3：置/撤钳即广播，各壳 fz 应用据此把生效值 cap 到 2.0（存储值不动） */
          try{window.dispatchEvent(new Event("ky:reclamp"));}catch(e){}}
      };
      reclamp();
      window.addEventListener("orientationchange",function(){setTimeout(reclamp,120);});
      window.addEventListener("resize",function(){setTimeout(reclamp,120);});
    }
  }catch(e){}
  if(!("ontouchstart" in window))return;
  var st=document.createElement("style");
  /* touch-action 必须落在命中目标上（只挂 body 时后代仍会吃双击缩放手势——手机双击查词难产的主嫌） */
  st.textContent="html,body,body *{touch-action:manipulation;}"
    +(opt.calloutSel?opt.calloutSel+"{-webkit-touch-callout:none;}":"")                    /* 只禁系统长按菜单（保留选区能力） */
    +(opt.noSelectSel?opt.noSelectSel+"{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}":"");
  document.head.appendChild(st);
  /* 双 tap → 合成 dblclick（iOS Safari 触屏不产原生 dblclick）
     宽容参数：≤450ms/≤44px；派发用「第一击」的坐标与元素——第二击手指常漂到邻词/空白 */
  var lt=0,lx=0,ly=0,lel=null;
  document.addEventListener("touchend",function(e){
    if(e.touches&&e.touches.length)return;
    var t=e.changedTouches&&e.changedTouches[0];if(!t)return;
    if(e.target&&e.target.closest&&e.target.closest("input,textarea,select,#kysync-panel"))return;
    var n=Date.now();
    var db=(n-lt)<450&&Math.hypot(t.clientX-lx,t.clientY-ly)<44;
    if(!db){lt=n;lx=t.clientX;ly=t.clientY;lel=e.target;return;}   /* 记 target 而非 elementFromPoint：捏合缩放下坐标系错位免疫（WebKit #170981） */
    var px=lx,py=ly,pel=(lel&&lel.isConnected)?lel:null;
    lt=0;lel=null;
    /* 延后派发恢复桌面事件序 click,click,dblclick——iOS 兼容鼠标事件在 touchend 之后才发，
       同步派发会变成 click①→dblclick→click②，尾随 click 覆写澈泡/误推导读（审查官发现①） */
    setTimeout(function(){
      if(opt.wordSelect)selectWordAt(px,py);
      var tgt=pel||document.elementFromPoint(px,py)||document.body;
      var ev;
      try{ev=new MouseEvent("dblclick",{bubbles:true,cancelable:true,view:window,clientX:px,clientY:py});}
      catch(err){ev=document.createEvent("MouseEvents");ev.initMouseEvent("dblclick",true,true,window,2,0,0,px,py,false,false,false,false,0,null);}
      tgt.dispatchEvent(ev);
    },120);
  },{passive:true});
  function selectWordAt(x,y){ /* 给「读选区」型双击处理器铺路：程序化选中所点单词 */
    try{
      var r=document.caretRangeFromPoint?document.caretRangeFromPoint(x,y):null;
      if(!r||r.startContainer.nodeType!==3)return;
      var node=r.startContainer,s=node.textContent,a=r.startOffset,b=a;
      while(a>0&&/[A-Za-z'\-]/.test(s.charAt(a-1)))a--;
      while(b<s.length&&/[A-Za-z'\-]/.test(s.charAt(b)))b++;
      if(b<=a)return;
      var rng=document.createRange();rng.setStart(node,a);rng.setEnd(node,b);
      var sel=window.getSelection();sel.removeAllRanges();sel.addRange(rng);
    }catch(e){}
  }
}

/* ---------------- 历史栈垫片（PROGRESS AI 追记四；I2 重写）：手机侧滑/浏览器返回=上一层而非直接离页
   levels=[{isOpen,close}] 自顶向底；「有层敞开↔历史签在位」由 ensureTag 对齐——冒泡相 click/touchend/keyup
   三监听在同一手势派发内同步补签（携用户激活，防 WebKit #248303 跳过无手势 pushState）+ 600ms 轮询兜底桌面/深链。
   开层→补签 pushState（仅未抛异常后置签）；侧滑/返回→popstate pop 签并 close() 最上层，setTimeout(0) 内若下面
   还有层立即补签（逐层可退）；UI 键自关→ensureTag 见无层有签即 history.back() 消签。签全消后再滑=原生离页（回枢纽）。 */
function histShim(levels){
  try{if(!window.history||!history.pushState||!levels||!levels.length)return;}catch(e){return;}
  var tagged=false;
  function top(){for(var i=0;i<levels.length;i++){try{if(levels[i].isOpen())return levels[i];}catch(e){}}return null;}
  function hasTag(){try{return !!(history.state&&history.state.ky);}catch(e){return tagged;}}
  function ensureTag(){                                    /* 层签对齐：有层无签补签、无层有签消签 */
    var open=!!top();
    if(open&&!tagged){try{history.pushState({ky:1},"");tagged=true;}catch(e){}}   /* 仅未抛异常后才置签 */
    else if(!open&&tagged){tagged=false;if(hasTag()){try{history.back();}catch(e){}}}
  }
  window.addEventListener("popstate",function(){
    var L=top();
    if(L){tagged=false;try{L.close();}catch(e){}
      setTimeout(function(){if(top())ensureTag();},0);     /* 关顶层后若下面还有层：导航语境立即补签，逐层可退（I2） */
    }
  });
  /* 冒泡相挂 click/touchend/keyup：同一手势派发内同步补签，携用户激活标记，防 WebKit #248303 跳过无手势签（I2） */
  ["click","touchend","keyup"].forEach(function(t){document.addEventListener(t,function(){ensureTag();},false);});
  setInterval(ensureTag,600);                              /* 桌面/深链兜底（无手势场景） */
}

function mount(adapter){

  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}  /* iOS Safari 7 日无访问清档：申请持久存储豁免（I6） */
  mobilePatch(A.mobile||{});
  var tries=0;
  (function waitReady(){
    var ok=true;
    try{ok=!A.ready||A.ready();}catch(e){ok=false;}
    if(!ok&&++tries<120)return setTimeout(waitReady,500);

function lsStores(keys){

    set:function(d){try{localStorage.setItem(k,JSON.stringify(d));}catch(e){}}
